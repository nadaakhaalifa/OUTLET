# Local search engines for the ADR-0010 bake-off. Dev only: security is OFF, ports bind to 127.0.0.1.
# Start: docker compose -f infra/local/search/docker-compose.search.yml up -d
# Pinned tags were chosen from memory of recent stable releases; confirm each exists and is current before the run (V47, V67).
name: outlet-search-bakeoff

services:
  typesense:
    image: typesense/typesense:27.1
    command: ["--data-dir=/data", "--api-key=bakeoff-local-key", "--enable-cors=false"]
    ports: ["127.0.0.1:8108:8108"]
    volumes: ["typesense-data:/data"]

  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    environment:
      MEILI_ENV: development # no master key; development mode only
      MEILI_NO_ANALYTICS: "true"
    ports: ["127.0.0.1:7700:7700"]
    volumes: ["meili-data:/meili_data"]

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]

volumes:
  typesense-data:
  meili-data:
  opensearch-data:
