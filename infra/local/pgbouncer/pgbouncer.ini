; PgBouncer, transaction pooling. Local-only.
;
; POOL MATH (Postgres max_connections = 100):
;   outlet_catalog      pool_size 20  (catalog.read, general API)
;   outlet_checkout     pool_size 10 + reserve 5 (checkout.reserve, isolated so analytics/reads cannot starve it)
;   outlet_auth 5, outlet_worker 5 (ADR-0011)
;   reserve_pool_size is per-database; worst case via PgBouncer = 20 + 10 + 5 + 5 + 5 = 45 (+5 auth/worker reserve headroom)
;   Direct (migrator, psql, tests) <= 10, superuser reserved 3  => 53 of 100. Headroom for replicas/jobs.
;   Production rule: pools x pool_size x API instances < max_connections.
;
; WHY `SET LOCAL` PER TRANSACTION IS MANDATORY:
;   In transaction mode a client can get a different server connection on every transaction, and a server
;   connection is shared by many clients. Session-level SET (e.g. SET app.current_store_id, SET ROLE,
;   statement_timeout) persists on the server connection and LEAKS to the next client = cross-tenant RLS leak.
;   Always BEGIN; SET LOCAL app.current_store_id = ...; ... COMMIT. Do not use session advisory locks,
;   LISTEN/NOTIFY or session-level prepared statements through this pooler.
; ADR-0011: role = pool (each alias pins user=; never SET ROLE through the pooler).
;   outlet_catalog  -> outlet_app    20
;   outlet_checkout -> outlet_app    10 + 5 reserve
;   outlet_auth     -> outlet_auth    5
;   outlet_worker   -> outlet_worker  5
;   Worst case via PgBouncer = 20 + 10 + 5 + 5 + 5 + 5 = 50 server connections (the older "40" above predates the auth/worker pools).
[databases]
outlet_catalog  = host=postgres port=5432 dbname=outlet_dev user=outlet_app pool_size=20
outlet_checkout = host=postgres port=5432 dbname=outlet_dev user=outlet_app pool_size=10 reserve_pool=5
outlet_auth     = host=postgres port=5432 dbname=outlet_dev user=outlet_auth pool_size=5
outlet_worker   = host=postgres port=5432 dbname=outlet_dev user=outlet_worker pool_size=5

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; Empty on purpose: transaction mode must not run DISCARD ALL; isolation comes from SET LOCAL.
server_reset_query =
ignore_startup_parameters = extra_float_digits
max_client_conn = 500
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
max_prepared_statements = 100
admin_users = outlet_migrator
log_connections = 0
log_disconnections = 0
