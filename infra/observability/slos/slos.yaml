# SLO definitions as code. One entry per row of the spec T8 table.
# Metric names are the contract described in infra/observability/otel-conventions.md;
# no service emits them yet (no backend exists, ADR-0006), so every SLI is a proposal until instrumented.
# Window "{{window}}" is substituted by the generator.
version: 1
period: 28d
# Budget fractions follow the SRE Workbook (2% in 1h, 5% in 6h), re-derived for a 28d period:
#   burn = fraction * period / window  ->  fast 13.44, slow 5.6
tiers:
  - { name: fast, long: 1h, short: 5m, budgetFraction: 0.02, for: 2m }
  - { name: slow, long: 6h, short: 30m, budgetFraction: 0.05, for: 15m }

slos:
  - id: checkout-success
    title: Checkout success
    journey: checkout
    specRow: "T8 Checkout"
    owner: payments-team
    runbook: docs/runbooks/psp-outage.md
    dashboard: checkout
    kind: ratio
    objective: 0.995
    sli:
      description: Successful order placements over attempts, excluding attempts the user declined (cancelled, abandoned 3-DS, changed their mind).
      bad: 'sum(rate(outlet_checkout_attempts_total{outcome="failed"}[{{window}}]))'
      total: 'sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[{{window}}]))'
    minEventsPerWindow: 50
    slowSeverity: page
    alertOnAbsent: true

  - id: reserve-latency
    title: Reservation latency
    journey: reservation
    specRow: "T8 Reserve"
    owner: commerce-core-team
    runbook: docs/runbooks/incident-response.md
    dashboard: reservation
    kind: latency
    objective: 0.95
    sli:
      description: Share of reserve transactions completing in under 150 ms, which is the p95 < 150 ms objective expressed as an event ratio.
      histogram: outlet_reserve_duration_seconds
      selector: ""
      thresholdSeconds: 0.15
      percentile: 0.95
    minEventsPerWindow: 100
    slowSeverity: ticket
    alertOnAbsent: false

  - id: payment-confirmation-latency
    title: Payment confirmation latency
    journey: payments
    specRow: "T8 Payment confirmation"
    owner: payments-team
    runbook: docs/runbooks/psp-outage.md
    dashboard: payments
    kind: latency
    objective: 0.95
    sli:
      description: Share of PSP webhooks that move the order to PAID within 5 s of webhook receipt, which is the p95 < 5 s objective expressed as an event ratio.
      histogram: outlet_payment_confirmation_duration_seconds
      selector: ""
      thresholdSeconds: 5
      percentile: 0.95
    minEventsPerWindow: 50
    slowSeverity: page
    alertOnAbsent: false
    verifyNote: "Measured from webhook receipt in HAUL, not from the shopper's tap; PSP-side delay is not in this SLI."

  - id: api-read-latency
    title: API read latency
    journey: api
    specRow: "T8 API"
    owner: platform-team
    runbook: docs/runbooks/incident-response.md
    dashboard: api
    kind: latency
    objective: 0.95
    sli:
      description: Share of read requests (GET) answered in under 300 ms, measured at the API edge, which is the p95 < 300 ms objective expressed as an event ratio.
      histogram: http_server_request_duration_seconds
      selector: 'http_request_method="GET"'
      thresholdSeconds: 0.3
      percentile: 0.95
    minEventsPerWindow: 500
    slowSeverity: ticket
    alertOnAbsent: true

  - id: search-latency
    title: Search latency
    journey: search
    specRow: "T8 Search"
    owner: discovery-team
    runbook: docs/runbooks/degraded-mode-matrix.md
    dashboard: search
    kind: latency
    objective: 0.95
    sli:
      description: Share of search queries answered in under 150 ms, which is the p95 < 150 ms objective expressed as an event ratio. Postgres fallback queries count too.
      histogram: outlet_search_duration_seconds
      selector: ""
      thresholdSeconds: 0.15
      percentile: 0.95
    minEventsPerWindow: 100
    slowSeverity: ticket
    alertOnAbsent: true

  - id: mobile-crash-free
    title: Mobile crash-free sessions
    journey: mobile
    specRow: "T8 Mobile"
    owner: mobile-team
    runbook: docs/runbooks/incident-response.md
    dashboard: mobile
    kind: ratio
    objective: 0.998
    sli:
      description: Sessions that did not end in a crash over all sessions, across iOS and Android, from consented sessions only.
      bad: 'sum(rate(outlet_mobile_sessions_total{crashed="true"}[{{window}}]))'
      total: 'sum(rate(outlet_mobile_sessions_total[{{window}}]))'
    minEventsPerWindow: 200
    slowSeverity: ticket
    alertOnAbsent: false
    verifyNote: "VERIFY BEFORE LAUNCH: crash reporting needs a consent purpose; B1 lists no crash purpose. Until decided the SLI covers consented sessions only and is biased."

  - id: refund-initiation
    title: Refund initiation within 24 h
    journey: refunds
    specRow: "T8 Refunds"
    owner: finance-ops
    runbook: docs/runbooks/reconciliation-break.md
    dashboard: reconciliation
    kind: ratio
    objective: 0.99
    sli:
      description: Refunds initiated within 24 h of return receipt over all refunds that became due, counted when initiated or when the deadline passes.
      bad: 'sum(rate(outlet_refund_sla_total{outcome="missed"}[{{window}}]))'
      total: 'sum(rate(outlet_refund_sla_total[{{window}}]))'
    minEventsPerWindow: 20
    slowSeverity: ticket
    alertOnAbsent: false
    verifyNote: "VERIFY: the refund deadline is contradicted in the spec (14 days from delivery in B5 versus from return receipt in 15.6); this SLO is the internal 24 h handling target, not the legal deadline."

  - id: reconciliation-unmatched
    title: Unmatched PSP lines older than 3 days
    journey: reconciliation
    specRow: "T8 Reconciliation"
    owner: finance-ops
    runbook: docs/runbooks/reconciliation-break.md
    dashboard: reconciliation
    kind: zero_gauge
    objective: 0
    sli:
      description: Count of PSP settlement lines with no matching ledger entry that are older than 3 days. The objective is exactly zero.
      gauge: 'max(outlet_reconciliation_unmatched_lines{age_bucket="gt_3d"})'
    alerts:
      - { for: 5m, severity: ticket }
      - { for: 24h, severity: page }
