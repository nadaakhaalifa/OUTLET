# Generated by tooling/infra/gen-prom-tests.py. Synthetic series, 600 events/min.
# Run: promtool test rules infra/observability/prometheus/tests/mobile-crash-free.test.yaml
rule_files:
  - ../rules/slo-mobile-crash-free.rules.yaml

evaluation_interval: 30s

tests:
  - interval: 1m
    input_series:
      - series: "outlet_mobile_sessions_total{crashed=\"true\"}"
        values: "0+0x180 18+18x64"
      - series: "outlet_mobile_sessions_total{crashed=\"false\"}"
        values: "0+600x180 108582+582x64"
    # fast burn pages
    alert_rule_test:
      - eval_time: 170m
        alertname: SLOFastBurnMobileCrashFree
        exp_alerts: []
      - eval_time: 245m
        alertname: SLOFastBurnMobileCrashFree
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "mobile-crash-free"
              journey: "mobile"
              tier: "fast"
              burn_rate: "13.44"
            exp_annotations:
              summary: "Mobile crash-free sessions: error budget burning at 13.44x over 1h and 5m"
              description: "Error ratio above 0.02688 (burn rate 13.44 x budget 0.002) on both the 1h and 5m windows. At this rate the 28d budget is gone in 50 hours."
              runbook: "docs/runbooks/incident-response.md"
              dashboard: "outlet-mobile"
              spec_row: "T8 Mobile"

  - interval: 1m
    input_series:
      - series: "outlet_mobile_sessions_total{crashed=\"true\"}"
        values: "0+15x420"
      - series: "outlet_mobile_sessions_total{crashed=\"false\"}"
        values: "0+585x420"
    # slow burn fires slow only
    alert_rule_test:
      - eval_time: 420m
        alertname: SLOSlowBurnMobileCrashFree
        exp_alerts:
          - exp_labels:
              severity: "ticket"
              slo: "mobile-crash-free"
              journey: "mobile"
              tier: "slow"
              burn_rate: "5.6"
            exp_annotations:
              summary: "Mobile crash-free sessions: error budget burning at 5.6x over 6h and 30m"
              description: "Error ratio above 0.0112 (burn rate 5.6 x budget 0.002) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours."
              runbook: "docs/runbooks/incident-response.md"
              dashboard: "outlet-mobile"
              spec_row: "T8 Mobile"
      - eval_time: 420m
        alertname: SLOFastBurnMobileCrashFree
        exp_alerts: []
      - eval_time: 200m
        alertname: SLOFastBurnMobileCrashFree
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_mobile_sessions_total{crashed=\"true\"}"
        values: "0+6x480"
      - series: "outlet_mobile_sessions_total{crashed=\"false\"}"
        values: "0+594x480"
    # just under the slow threshold fires nothing
    alert_rule_test:
      - eval_time: 480m
        alertname: SLOFastBurnMobileCrashFree
        exp_alerts: []
      - eval_time: 480m
        alertname: SLOSlowBurnMobileCrashFree
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_mobile_sessions_total{crashed=\"true\"}"
        values: "0+0x480"
      - series: "outlet_mobile_sessions_total{crashed=\"false\"}"
        values: "0+600x480"
    # healthy fires nothing
    alert_rule_test:
      - eval_time: 480m
        alertname: SLOFastBurnMobileCrashFree
        exp_alerts: []
      - eval_time: 480m
        alertname: SLOSlowBurnMobileCrashFree
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_mobile_sessions_total{crashed=\"true\"}"
        values: "0+0x180 18+18x59 1080+0x59"
      - series: "outlet_mobile_sessions_total{crashed=\"false\"}"
        values: "0+600x180 108582+582x59 143520+600x59"
    # fast burn resolves
    alert_rule_test:
      - eval_time: 238m
        alertname: SLOFastBurnMobileCrashFree
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "mobile-crash-free"
              journey: "mobile"
              tier: "fast"
              burn_rate: "13.44"
            exp_annotations:
