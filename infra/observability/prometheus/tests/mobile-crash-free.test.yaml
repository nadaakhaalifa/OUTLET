              description: "Error ratio above 0.0112 (burn rate 5.6 x budget 0.002) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours."
              runbook: "docs/runbooks/incident-response.md"
              dashboard: "outlet-mobile"
              spec_row: "T8 Mobile"
      - eval_time: 420m
        alertname: SLOSlowBurnMobileCrashFree
        exp_alerts:
          - exp_labels:
              severity: "ticket"
              slo: "mobile-crash-free"
              journey: "mobile"
              tier: "slow"
