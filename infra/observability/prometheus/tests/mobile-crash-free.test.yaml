      - series: "outlet_mobile_sessions_total{crashed=\"false\"}"
        values: "0+450x90"
    # recording rules compute the ratio
    alert_rule_test:
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate5m{slo="mobile-crash-free"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{slo="mobile-crash-free", journey="mobile"}'
