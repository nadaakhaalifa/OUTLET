# Hand-written promtool tests for rules/ledger-integrity.rules.yaml (ADR-0046, dashboard foundations track 3).
rule_files:
  - ../rules/ledger-integrity.rules.yaml

evaluation_interval: 1m

tests:
  # healthy: ok == 1, age grows but stays under both thresholds, no run errors
  - interval: 1m
    input_series:
      - series: 'outlet_ledger_integrity_ok{mode="batch"}'
        values: "1x600"
      - series: 'outlet_ledger_integrity_last_completed_age_seconds{mode="batch"}'
        values: "0+60x600"
    alert_rule_test:
      - {eval_time: 500m, alertname: LedgerIntegrityFailed, exp_alerts: []}
      - {eval_time: 500m, alertname: LedgerIntegrityAbsent, exp_alerts: []}
      - {eval_time: 500m, alertname: LedgerIntegrityStaleBatch, exp_alerts: []}

  # failure: ok drops to 0 at minute 10; pages after 1 minute, not before
  - interval: 1m
    input_series:
      - series: 'outlet_ledger_integrity_ok{mode="batch"}'
        values: "1x9 0x30"
    alert_rule_test:
      - {eval_time: 10m, alertname: LedgerIntegrityFailed, exp_alerts: []}
      - {eval_time: 10m30s, alertname: LedgerIntegrityFailed, exp_alerts: []}
      - eval_time: 11m
        alertname: LedgerIntegrityFailed
        exp_alerts:
          - exp_labels: {severity: page, service: ledger, notify: "finance,security", tier: failed, mode: batch}
            exp_annotations:
              summary: Ledger integrity check failed
              description: The latest completed ledger integrity run failed, or its audit evidence is missing. Open GET /v1/admin/ledger/integrity as finance for the run id and the state. Details are deliberately not part of this alert.
              runbook: docs/runbooks/ledger-integrity.md

  # recovery: back to 1 at minute 20 clears the alert
  - interval: 1m
    input_series:
      - series: 'outlet_ledger_integrity_ok{mode="batch"}'
        values: "1x9 0x10 1x30"
    alert_rule_test:
      - {eval_time: 15m, alertname: LedgerIntegrityFailed, exp_alerts: [{exp_labels: {severity: page, service: ledger, notify: "finance,security", tier: failed, mode: batch}, exp_annotations: {summary: Ledger integrity check failed, description: "The latest completed ledger integrity run failed, or its audit evidence is missing. Open GET /v1/admin/ledger/integrity as finance for the run id and the state. Details are deliberately not part of this alert.", runbook: docs/runbooks/ledger-integrity.md}}]}
      - {eval_time: 21m, alertname: LedgerIntegrityFailed, exp_alerts: []}

  # batch staleness: age is 60 s per minute; 26 h = 93600 s = minute 1560. Not at 1560 (equal), fires at 1561.
  - interval: 1m
    input_series:
      - series: 'outlet_ledger_integrity_last_completed_age_seconds{mode="batch"}'
        values: "0+60x1700"
    alert_rule_test:
      - {eval_time: 1559m, alertname: LedgerIntegrityStaleBatch, exp_alerts: []}
      - {eval_time: 1560m, alertname: LedgerIntegrityStaleBatch, exp_alerts: []}
      - eval_time: 1561m
        alertname: LedgerIntegrityStaleBatch
        exp_alerts:
          - exp_labels: {severity: page, service: ledger, notify: finance, tier: stale-batch, mode: batch}
            exp_annotations:
              summary: No completed ledger integrity run for more than 26 hours
              description: The nightly run (02:30 Cairo) has not completed for more than 26 hours. The state is stale or error_only on GET /v1/admin/ledger/integrity.
              runbook: docs/runbooks/ledger-integrity.md
      - {eval_time: 1561m, alertname: LedgerIntegrityStaleEventMode, exp_alerts: []}

  # event-mode staleness: 90 min = 5400 s = minute 90. Not at 90, fires at 91.
  - interval: 1m
    input_series:
      - series: 'outlet_ledger_integrity_last_completed_age_seconds{mode="event"}'
        values: "0+60x200"
    alert_rule_test:
      - {eval_time: 89m, alertname: LedgerIntegrityStaleEventMode, exp_alerts: []}
      - {eval_time: 90m, alertname: LedgerIntegrityStaleEventMode, exp_alerts: []}
      - eval_time: 91m
        alertname: LedgerIntegrityStaleEventMode
        exp_alerts:
          - exp_labels: {severity: page, service: ledger, notify: finance, tier: stale-event, mode: event}
            exp_annotations:
              summary: No completed ledger integrity run for more than 90 minutes in event mode
              description: The 30-minute event-mode run has not completed for more than 90 minutes. The state is stale or error_only on GET /v1/admin/ledger/integrity.
              runbook: docs/runbooks/ledger-integrity.md
      - {eval_time: 91m, alertname: LedgerIntegrityStaleBatch, exp_alerts: []}

  # absence: the gauge is last seen at minute 0 and then stops. Not at 29m, fires at 30m; recovery at 45m clears.
  - interval: 1m
    input_series:
      - series: 'outlet_ledger_integrity_ok{mode="batch"}'
        values: "1 _x43 1x20"
    alert_rule_test:
      - {eval_time: 29m, alertname: LedgerIntegrityAbsent, exp_alerts: []}
      - eval_time: 30m
        alertname: LedgerIntegrityAbsent
        exp_alerts:
          - exp_labels: {severity: page, service: ledger, notify: "finance,platform", tier: absent}
            exp_annotations:
              summary: Ledger integrity gauge absent for 30 minutes
              description: No completed integrity run exists, the API is not exporting the gauge, or the collector path is broken. An empty result table also reaches this state, so a ledger that was never checked cannot look healthy.
              runbook: docs/runbooks/ledger-integrity.md
      - {eval_time: 45m, alertname: LedgerIntegrityAbsent, exp_alerts: []}

  # run errors and audit failures: ticket on any increase in the hour window
  - interval: 1m
    input_series:
      - series: 'outlet_ledger_integrity_runs_total{outcome="error"}'
        values: "0x10 1x20 1x100"
      - series: 'outlet_ledger_integrity_audit_failed_total'
        values: "0x10 1x20 1x100"
    alert_rule_test:
      - {eval_time: 9m, alertname: LedgerIntegrityRunErrors, exp_alerts: []}
      - eval_time: 12m
        alertname: LedgerIntegrityRunErrors
        exp_alerts:
          - exp_labels: {severity: ticket, service: ledger, notify: platform, tier: run-errors, outcome: error}
            exp_annotations:
              summary: Ledger integrity run errored or timed out in the last hour
              description: An integrity attempt ended in error or timeout. The latest completed result is unchanged and the staleness alerts cover the gap.
              runbook: docs/runbooks/ledger-integrity.md
      - eval_time: 12m
        alertname: LedgerIntegrityAuditFailed
        exp_alerts:
          - exp_labels: {severity: ticket, service: ledger, notify: platform, tier: audit-failed}
            exp_annotations:
              summary: A completed ledger integrity run was rolled back because its audit row could not be written
              description: No completed row was stored, so the gauges age and the staleness alerts will fire. Check the audit log writer.
              runbook: docs/runbooks/ledger-integrity.md
      - {eval_time: 100m, alertname: LedgerIntegrityRunErrors, exp_alerts: []}
