# Generated by tooling/infra/gen-prom-tests.py. Synthetic series, 600 events/min.
# Run: promtool test rules infra/observability/prometheus/tests/search-latency.test.yaml
rule_files:
  - ../rules/slo-search-latency.rules.yaml

evaluation_interval: 30s

tests:
  - interval: 1m
    input_series:
      - series: "outlet_search_duration_seconds_bucket{le=\"0.15\"}"
        values: "0+600x180 108156+156x64"
      - series: "outlet_search_duration_seconds_count"
        values: "0+600x245"
    # fast burn pages
    alert_rule_test:
      - eval_time: 170m
        alertname: SLOFastBurnSearchLatency
        exp_alerts: []
      - eval_time: 245m
        alertname: SLOFastBurnSearchLatency
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "search-latency"
              journey: "search"
              tier: "fast"
              burn_rate: "13.44"
            exp_annotations:
              summary: "Search latency: error budget burning at 13.44x over 1h and 5m"
              description: "Error ratio above 0.672 (burn rate 13.44 x budget 0.05) on both the 1h and 5m windows. At this rate the 28d budget is gone in 50 hours."
              runbook: "docs/runbooks/degraded-mode-matrix.md"
              dashboard: "outlet-search"
              spec_row: "T8 Search"

  - interval: 1m
    input_series:
      - series: "outlet_search_duration_seconds_bucket{le=\"0.15\"}"
        values: "0+217x420"
      - series: "outlet_search_duration_seconds_count"
        values: "0+600x420"
    # slow burn fires slow only
    alert_rule_test:
      - eval_time: 420m
        alertname: SLOSlowBurnSearchLatency
        exp_alerts:
          - exp_labels:
              severity: "ticket"
              slo: "search-latency"
              journey: "search"
              tier: "slow"
              burn_rate: "5.6"
            exp_annotations:
              summary: "Search latency: error budget burning at 5.6x over 6h and 30m"
              description: "Error ratio above 0.28 (burn rate 5.6 x budget 0.05) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours."
              runbook: "docs/runbooks/degraded-mode-matrix.md"
              dashboard: "outlet-search"
              spec_row: "T8 Search"
      - eval_time: 420m
        alertname: SLOFastBurnSearchLatency
        exp_alerts: []
      - eval_time: 200m
        alertname: SLOFastBurnSearchLatency
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_search_duration_seconds_bucket{le=\"0.15\"}"
        values: "0+449x480"
      - series: "outlet_search_duration_seconds_count"
        values: "0+600x480"
    # just under the slow threshold fires nothing
    alert_rule_test:
      - eval_time: 480m
        alertname: SLOFastBurnSearchLatency
        exp_alerts: []
      - eval_time: 480m
        alertname: SLOSlowBurnSearchLatency
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_search_duration_seconds_bucket{le=\"0.15\"}"
        values: "0+600x480"
      - series: "outlet_search_duration_seconds_count"
        values: "0+600x480"
    # healthy fires nothing
    alert_rule_test:
      - eval_time: 480m
        alertname: SLOFastBurnSearchLatency
        exp_alerts: []
      - eval_time: 480m
        alertname: SLOSlowBurnSearchLatency
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_search_duration_seconds_bucket{le=\"0.15\"}"
        values: "0+600x180 108156+156x59 117960+600x59"
      - series: "outlet_search_duration_seconds_count"
        values: "0+600x300"
    # fast burn resolves
    alert_rule_test:
      - eval_time: 238m
        alertname: SLOFastBurnSearchLatency
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "search-latency"
              journey: "search"
              tier: "fast"
              burn_rate: "13.44"
            exp_annotations:
              summary: "Search latency: error budget burning at 13.44x over 1h and 5m"
              description: "Error ratio above 0.672 (burn rate 13.44 x budget 0.05) on both the 1h and 5m windows. At this rate the 28d budget is gone in 50 hours."
              runbook: "docs/runbooks/degraded-mode-matrix.md"
              dashboard: "outlet-search"
              spec_row: "T8 Search"
      - eval_time: 255m
        alertname: SLOFastBurnSearchLatency
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_search_duration_seconds_bucket{le=\"0.15\"}"
        values: "0+0x420 600+600x36"
      - series: "outlet_search_duration_seconds_count"
        values: "0+600x457"
    # slow burn resolves
    alert_rule_test:
      - eval_time: 420m
        alertname: SLOSlowBurnSearchLatency
        exp_alerts:
          - exp_labels:
              severity: "ticket"
              slo: "search-latency"
              journey: "search"
              tier: "slow"
              burn_rate: "5.6"
            exp_annotations:
              summary: "Search latency: error budget burning at 5.6x over 6h and 30m"
              description: "Error ratio above 0.28 (burn rate 5.6 x budget 0.05) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours."
              runbook: "docs/runbooks/degraded-mode-matrix.md"
              dashboard: "outlet-search"
              spec_row: "T8 Search"
      - eval_time: 457m
        alertname: SLOSlowBurnSearchLatency
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_search_duration_seconds_bucket{le=\"0.15\"}"
        values: "0+415x420"
      - series: "outlet_search_duration_seconds_count"
        values: "0+600x420"
    # slow burn just above threshold
    alert_rule_test:
      - eval_time: 10m
        alertname: SLOSlowBurnSearchLatency
        exp_alerts: []
      - eval_time: 25m
        alertname: SLOSlowBurnSearchLatency
        exp_alerts:
          - exp_labels:
              severity: "ticket"
              slo: "search-latency"
              journey: "search"
              tier: "slow"
              burn_rate: "5.6"
            exp_annotations:
              summary: "Search latency: error budget burning at 5.6x over 6h and 30m"
              description: "Error ratio above 0.28 (burn rate 5.6 x budget 0.05) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours."
              runbook: "docs/runbooks/degraded-mode-matrix.md"
              dashboard: "outlet-search"
              spec_row: "T8 Search"
      - eval_time: 420m
        alertname: SLOSlowBurnSearchLatency
        exp_alerts:
          - exp_labels:
              severity: "ticket"
              slo: "search-latency"
              journey: "search"
              tier: "slow"
              burn_rate: "5.6"
            exp_annotations:
              summary: "Search latency: error budget burning at 5.6x over 6h and 30m"
              description: "Error ratio above 0.28 (burn rate 5.6 x budget 0.05) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours."
              runbook: "docs/runbooks/degraded-mode-matrix.md"
              dashboard: "outlet-search"
              spec_row: "T8 Search"
      - eval_time: 420m
        alertname: SLOFastBurnSearchLatency
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_search_duration_seconds_bucket{le=\"0.15\"}"
        values: "0+450x90"
      - series: "outlet_search_duration_seconds_count"
        values: "0+600x90"
    # recording rules compute the ratio
    alert_rule_test:
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate5m{slo="search-latency"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{slo="search-latency", journey="search"}'
            value: 0.25
      - expr: slo:sli_events:rate5m{slo="search-latency"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_events:rate5m{slo="search-latency", journey="search"}'
            value: 10
      - expr: slo:sli_error:ratio_rate30m{slo="search-latency"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate30m{slo="search-latency", journey="search"}'
            value: 0.25
      - expr: slo:sli_events:rate30m{slo="search-latency"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_events:rate30m{slo="search-latency", journey="search"}'
            value: 10
      - expr: slo:sli_error:ratio_rate1h{slo="search-latency"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate1h{slo="search-latency", journey="search"}'
            value: 0.25
      - expr: slo:sli_events:rate1h{slo="search-latency"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_events:rate1h{slo="search-latency", journey="search"}'
            value: 10

  - interval: 1m
    input_series: []
    # no series at all
    alert_rule_test:
      - eval_time: 2m
        alertname: SLONoDataSearchLatency
        exp_alerts: []
      - eval_time: 80m
        alertname: SLONoDataSearchLatency
        exp_alerts:
          - exp_labels:
              severity: "ticket"
              slo: "search-latency"
              journey: "search"
              tier: "absent"
            exp_annotations:
              summary: "Search latency: no SLI data for 1h"
              description: "The SLI produced no events for an hour. Either traffic stopped or instrumentation broke; the burn-rate alerts are blind until this is resolved."
              runbook: "docs/runbooks/degraded-mode-matrix.md"
              dashboard: "outlet-search"
              spec_row: "T8 Search"
