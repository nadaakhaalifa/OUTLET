      - eval_time: 170m
        alertname: SLOFastBurnRefundInitiation
        exp_alerts: []
      - eval_time: 245m
        alertname: SLOFastBurnRefundInitiation
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "refund-initiation"
              journey: "refunds"
              tier: "fast"
              burn_rate: "13.44"
            exp_annotations:
              summary: "Refund initiation within 24 h: error budget burning at 13.44x over 1h and 5m"
              description: "Error ratio above 0.1344 (burn rate 13.44 x budget 0.01) on both the 1h and 5m windows. At this rate the 28d budget is gone in 50 hours."
              runbook: "docs/runbooks/reconciliation-break.md"
              dashboard: "outlet-reconciliation"
              spec_row: "T8 Refunds"

