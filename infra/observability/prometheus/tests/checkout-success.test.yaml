# Generated by tooling/infra/gen-prom-tests.py. Synthetic series, 600 events/min.
# Run: promtool test rules infra/observability/prometheus/tests/checkout-success.test.yaml
rule_files:
  - ../rules/slo-checkout-success.rules.yaml

evaluation_interval: 30s

tests:
  - interval: 1m
    input_series:
      - series: "outlet_checkout_attempts_total{outcome=\"failed\"}"
        values: "0+0x180 44+44x64"
      - series: "outlet_checkout_attempts_total{outcome=\"placed\"}"
        values: "0+600x180 108556+556x64"
    # fast burn pages
    alert_rule_test:
      - eval_time: 170m
        alertname: SLOFastBurnCheckoutSuccess
        exp_alerts: []
      - eval_time: 245m
        alertname: SLOFastBurnCheckoutSuccess
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "checkout-success"
              journey: "checkout"
              tier: "fast"
              burn_rate: "13.44"
            exp_annotations:
              summary: "Checkout success: error budget burning at 13.44x over 1h and 5m"
              description: "Error ratio above 0.0672 (burn rate 13.44 x budget 0.005) on both the 1h and 5m windows. At this rate the 28d budget is gone in 50 hours."
              runbook: "docs/runbooks/psp-outage.md"
              dashboard: "outlet-checkout"
              spec_row: "T8 Checkout"

  - interval: 1m
    input_series:
      - series: "outlet_checkout_attempts_total{outcome=\"failed\"}"
        values: "0+38x420"
      - series: "outlet_checkout_attempts_total{outcome=\"placed\"}"
        values: "0+562x420"
    # slow burn fires slow only
    alert_rule_test:
      - eval_time: 420m
        alertname: SLOSlowBurnCheckoutSuccess
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "checkout-success"
              journey: "checkout"
              tier: "slow"
              burn_rate: "5.6"
            exp_annotations:
              summary: "Checkout success: error budget burning at 5.6x over 6h and 30m"
              description: "Error ratio above 0.028 (burn rate 5.6 x budget 0.005) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours."
              runbook: "docs/runbooks/psp-outage.md"
              dashboard: "outlet-checkout"
              spec_row: "T8 Checkout"
      - eval_time: 420m
        alertname: SLOFastBurnCheckoutSuccess
        exp_alerts: []
      - eval_time: 200m
        alertname: SLOFastBurnCheckoutSuccess
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_checkout_attempts_total{outcome=\"failed\"}"
        values: "0+15x480"
      - series: "outlet_checkout_attempts_total{outcome=\"placed\"}"
        values: "0+585x480"
    # just under the slow threshold fires nothing
    alert_rule_test:
      - eval_time: 480m
        alertname: SLOFastBurnCheckoutSuccess
        exp_alerts: []
      - eval_time: 480m
        alertname: SLOSlowBurnCheckoutSuccess
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_checkout_attempts_total{outcome=\"failed\"}"
        values: "0+0x480"
      - series: "outlet_checkout_attempts_total{outcome=\"placed\"}"
        values: "0+600x480"
    # healthy fires nothing
    alert_rule_test:
      - eval_time: 480m
        alertname: SLOFastBurnCheckoutSuccess
        exp_alerts: []
      - eval_time: 480m
        alertname: SLOSlowBurnCheckoutSuccess
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_checkout_attempts_total{outcome=\"failed\"}"
        values: "0+0x180 44+44x59 2640+0x59"
      - series: "outlet_checkout_attempts_total{outcome=\"placed\"}"
        values: "0+600x180 108556+556x59 141960+600x59"
    # fast burn resolves
    alert_rule_test:
      - eval_time: 238m
        alertname: SLOFastBurnCheckoutSuccess
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "checkout-success"
              journey: "checkout"
              tier: "fast"
              burn_rate: "13.44"
            exp_annotations:
              summary: "Checkout success: error budget burning at 13.44x over 1h and 5m"
              description: "Error ratio above 0.0672 (burn rate 13.44 x budget 0.005) on both the 1h and 5m windows. At this rate the 28d budget is gone in 50 hours."
              runbook: "docs/runbooks/psp-outage.md"
              dashboard: "outlet-checkout"
              spec_row: "T8 Checkout"
      - eval_time: 255m
        alertname: SLOFastBurnCheckoutSuccess
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_checkout_attempts_total{outcome=\"failed\"}"
        values: "0+600x420 252000+0x36"
      - series: "outlet_checkout_attempts_total{outcome=\"placed\"}"
        values: "0+0x420 600+600x36"
    # slow burn resolves
    alert_rule_test:
      - eval_time: 420m
        alertname: SLOSlowBurnCheckoutSuccess
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "checkout-success"
              journey: "checkout"
              tier: "slow"
              burn_rate: "5.6"
            exp_annotations:
              summary: "Checkout success: error budget burning at 5.6x over 6h and 30m"
              description: "Error ratio above 0.028 (burn rate 5.6 x budget 0.005) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours."
              runbook: "docs/runbooks/psp-outage.md"
              dashboard: "outlet-checkout"
              spec_row: "T8 Checkout"
      - eval_time: 457m
        alertname: SLOSlowBurnCheckoutSuccess
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_checkout_attempts_total{outcome=\"failed\"}"
        values: "0+18x420"
      - series: "outlet_checkout_attempts_total{outcome=\"placed\"}"
        values: "0+582x420"
    # slow burn just above threshold
    alert_rule_test:
      - eval_time: 10m
        alertname: SLOSlowBurnCheckoutSuccess
        exp_alerts: []
      - eval_time: 25m
        alertname: SLOSlowBurnCheckoutSuccess
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "checkout-success"
              journey: "checkout"
              tier: "slow"
              burn_rate: "5.6"
            exp_annotations:
              summary: "Checkout success: error budget burning at 5.6x over 6h and 30m"
              description: "Error ratio above 0.028 (burn rate 5.6 x budget 0.005) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours."
              runbook: "docs/runbooks/psp-outage.md"
              dashboard: "outlet-checkout"
              spec_row: "T8 Checkout"
      - eval_time: 420m
        alertname: SLOSlowBurnCheckoutSuccess
        exp_alerts:
          - exp_labels:
              severity: "page"
              slo: "checkout-success"
              journey: "checkout"
              tier: "slow"
              burn_rate: "5.6"
            exp_annotations:
              summary: "Checkout success: error budget burning at 5.6x over 6h and 30m"
              description: "Error ratio above 0.028 (burn rate 5.6 x budget 0.005) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours."
              runbook: "docs/runbooks/psp-outage.md"
              dashboard: "outlet-checkout"
              spec_row: "T8 Checkout"
      - eval_time: 420m
        alertname: SLOFastBurnCheckoutSuccess
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: "outlet_checkout_attempts_total{outcome=\"failed\"}"
        values: "0+150x90"
      - series: "outlet_checkout_attempts_total{outcome=\"placed\"}"
        values: "0+450x90"
    # recording rules compute the ratio
    alert_rule_test:
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate5m{slo="checkout-success"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{slo="checkout-success", journey="checkout"}'
            value: 0.25
      - expr: slo:sli_events:rate5m{slo="checkout-success"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_events:rate5m{slo="checkout-success", journey="checkout"}'
            value: 10
      - expr: slo:sli_error:ratio_rate30m{slo="checkout-success"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate30m{slo="checkout-success", journey="checkout"}'
            value: 0.25
      - expr: slo:sli_events:rate30m{slo="checkout-success"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_events:rate30m{slo="checkout-success", journey="checkout"}'
            value: 10
      - expr: slo:sli_error:ratio_rate1h{slo="checkout-success"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate1h{slo="checkout-success", journey="checkout"}'
            value: 0.25
      - expr: slo:sli_events:rate1h{slo="checkout-success"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_events:rate1h{slo="checkout-success", journey="checkout"}'
            value: 10

  - interval: 1m
    input_series: []
    # no series at all
    alert_rule_test:
      - eval_time: 2m
        alertname: SLONoDataCheckoutSuccess
        exp_alerts: []
      - eval_time: 80m
        alertname: SLONoDataCheckoutSuccess
        exp_alerts:
          - exp_labels:
              severity: "ticket"
              slo: "checkout-success"
              journey: "checkout"
              tier: "absent"
            exp_annotations:
              summary: "Checkout success: no SLI data for 1h"
              description: "The SLI produced no events for an hour. Either traffic stopped or instrumentation broke; the burn-rate alerts are blind until this is resolved."
              runbook: "docs/runbooks/psp-outage.md"
              dashboard: "outlet-checkout"
              spec_row: "T8 Checkout"
