  - name: slo-reserve-latency-alerts
    rules:
      - alert: SLOFastBurnReserveLatency
        expr: |-
          slo:sli_error:ratio_rate1h{slo="reserve-latency"} > 0.672
            and
          slo:sli_error:ratio_rate5m{slo="reserve-latency"} > 0.672
            and
          slo:sli_events:rate1h{slo="reserve-latency"} * 3600 >= 100
        for: 2m
        labels:
          severity: page
          slo: reserve-latency
          journey: reservation
          tier: fast
          burn_rate: "13.44"
        annotations:
          summary: "Reservation latency: error budget burning at 13.44x over 1h and 5m"
          description: Error ratio above 0.672 (burn rate 13.44 x budget 0.05) on both the 1h and 5m windows. At this rate the 28d budget is gone in 50 hours.
          runbook: docs/runbooks/incident-response.md
          dashboard: outlet-reservation
          spec_row: T8 Reserve
