groups:
  - name: slo-search-latency-recording
    interval: 30s
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: 1 - (sum(rate(outlet_search_duration_seconds_bucket{le="0.15"}[5m])) / sum(rate(outlet_search_duration_seconds_count[5m])))
        labels:
          slo: search-latency
          journey: search
      - record: slo:sli_events:rate5m
        expr: sum(rate(outlet_search_duration_seconds_count[5m]))
        labels:
          slo: search-latency
          journey: search
      - record: slo:sli_error:ratio_rate30m
        expr: 1 - (sum(rate(outlet_search_duration_seconds_bucket{le="0.15"}[30m])) / sum(rate(outlet_search_duration_seconds_count[30m])))
        labels:
          slo: search-latency
          journey: search
      - record: slo:sli_events:rate30m
        expr: sum(rate(outlet_search_duration_seconds_count[30m]))
        labels:
          slo: search-latency
          journey: search
      - record: slo:sli_error:ratio_rate1h
        expr: 1 - (sum(rate(outlet_search_duration_seconds_bucket{le="0.15"}[1h])) / sum(rate(outlet_search_duration_seconds_count[1h])))
        labels:
          slo: search-latency
          journey: search
      - record: slo:sli_events:rate1h
        expr: sum(rate(outlet_search_duration_seconds_count[1h]))
        labels:
          slo: search-latency
          journey: search
      - record: slo:sli_error:ratio_rate6h
        expr: 1 - (sum(rate(outlet_search_duration_seconds_bucket{le="0.15"}[6h])) / sum(rate(outlet_search_duration_seconds_count[6h])))
        labels:
          slo: search-latency
          journey: search
      - record: slo:sli_events:rate6h
        expr: sum(rate(outlet_search_duration_seconds_count[6h]))
        labels:
          slo: search-latency
          journey: search
      - record: slo:sli_error:ratio_rate28d
        expr: 1 - (sum(rate(outlet_search_duration_seconds_bucket{le="0.15"}[28d])) / sum(rate(outlet_search_duration_seconds_count[28d])))
        labels:
          slo: search-latency
          journey: search
      - record: slo:sli_events:rate28d
        expr: sum(rate(outlet_search_duration_seconds_count[28d]))
        labels:
          slo: search-latency
          journey: search
  - name: slo-search-latency-alerts
    rules:
      - alert: SLOFastBurnSearchLatency
        expr: |-
          slo:sli_error:ratio_rate1h{slo="search-latency"} > 0.672
            and
          slo:sli_error:ratio_rate5m{slo="search-latency"} > 0.672
            and
          slo:sli_events:rate1h{slo="search-latency"} * 3600 >= 100
        for: 2m
        labels:
          severity: page
          slo: search-latency
          journey: search
          tier: fast
          burn_rate: "13.44"
        annotations:
          summary: "Search latency: error budget burning at 13.44x over 1h and 5m"
          description: Error ratio above 0.672 (burn rate 13.44 x budget 0.05) on both the 1h and 5m windows. At this rate the 28d budget is gone in 50 hours.
          runbook: docs/runbooks/degraded-mode-matrix.md
          dashboard: outlet-search
          spec_row: T8 Search
      - alert: SLOSlowBurnSearchLatency
        expr: |-
          slo:sli_error:ratio_rate6h{slo="search-latency"} > 0.28
            and
          slo:sli_error:ratio_rate30m{slo="search-latency"} > 0.28
            and
          slo:sli_events:rate6h{slo="search-latency"} * 21600 >= 100
        for: 15m
        labels:
          severity: ticket
          slo: search-latency
          journey: search
          tier: slow
          burn_rate: "5.6"
        annotations:
          summary: "Search latency: error budget burning at 5.6x over 6h and 30m"
          description: Error ratio above 0.28 (burn rate 5.6 x budget 0.05) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours.
          runbook: docs/runbooks/degraded-mode-matrix.md
          dashboard: outlet-search
          spec_row: T8 Search
      - alert: SLONoDataSearchLatency
        expr: absent_over_time(slo:sli_events:rate5m{slo="search-latency"}[1h])
        for: 5m
        labels:
          severity: ticket
          slo: search-latency
          journey: search
          tier: absent
        annotations:
          summary: "Search latency: no SLI data for 1h"
          description: The SLI produced no events for an hour. Either traffic stopped or instrumentation broke; the burn-rate alerts are blind until this is resolved.
          runbook: docs/runbooks/degraded-mode-matrix.md
          dashboard: outlet-search
          spec_row: T8 Search
