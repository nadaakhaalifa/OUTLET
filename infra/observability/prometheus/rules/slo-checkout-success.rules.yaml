# GENERATED by tooling/observability/generate.mjs from infra/observability/slos/slos.yaml.
# Do not edit by hand: change the SLO file and re-run the generator.
groups:
  - name: slo-checkout-success-recording
    interval: 30s
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: (sum(rate(outlet_checkout_attempts_total{outcome="failed"}[5m]))) / (sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[5m])))
        labels:
          slo: checkout-success
          journey: checkout
      - record: slo:sli_events:rate5m
        expr: sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[5m]))
        labels:
          slo: checkout-success
          journey: checkout
      - record: slo:sli_error:ratio_rate30m
        expr: (sum(rate(outlet_checkout_attempts_total{outcome="failed"}[30m]))) / (sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[30m])))
        labels:
          slo: checkout-success
          journey: checkout
      - record: slo:sli_events:rate30m
        expr: sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[30m]))
        labels:
          slo: checkout-success
          journey: checkout
      - record: slo:sli_error:ratio_rate1h
        expr: (sum(rate(outlet_checkout_attempts_total{outcome="failed"}[1h]))) / (sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[1h])))
        labels:
          slo: checkout-success
          journey: checkout
      - record: slo:sli_events:rate1h
        expr: sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[1h]))
        labels:
          slo: checkout-success
          journey: checkout
      - record: slo:sli_error:ratio_rate6h
        expr: (sum(rate(outlet_checkout_attempts_total{outcome="failed"}[6h]))) / (sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[6h])))
        labels:
          slo: checkout-success
          journey: checkout
      - record: slo:sli_events:rate6h
        expr: sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[6h]))
        labels:
          slo: checkout-success
          journey: checkout
      - record: slo:sli_error:ratio_rate28d
        expr: (sum(rate(outlet_checkout_attempts_total{outcome="failed"}[28d]))) / (sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[28d])))
        labels:
          slo: checkout-success
          journey: checkout
      - record: slo:sli_events:rate28d
        expr: sum(rate(outlet_checkout_attempts_total{outcome=~"placed|failed"}[28d]))
        labels:
          slo: checkout-success
          journey: checkout
  - name: slo-checkout-success-alerts
    rules:
      - alert: SLOFastBurnCheckoutSuccess
        expr: |-
          slo:sli_error:ratio_rate1h{slo="checkout-success"} > 0.0672
            and
          slo:sli_error:ratio_rate5m{slo="checkout-success"} > 0.0672
            and
          slo:sli_events:rate1h{slo="checkout-success"} * 3600 >= 50
        for: 2m
        labels:
          severity: page
          slo: checkout-success
          journey: checkout
          tier: fast
          burn_rate: "13.44"
        annotations:
          summary: "Checkout success: error budget burning at 13.44x over 1h and 5m"
          description: Error ratio above 0.0672 (burn rate 13.44 x budget 0.005) on both the 1h and 5m windows. At this rate the 28d budget is gone in 50 hours.
          runbook: docs/runbooks/psp-outage.md
          dashboard: outlet-checkout
          spec_row: T8 Checkout
      - alert: SLOSlowBurnCheckoutSuccess
        expr: |-
          slo:sli_error:ratio_rate6h{slo="checkout-success"} > 0.028
            and
          slo:sli_error:ratio_rate30m{slo="checkout-success"} > 0.028
            and
          slo:sli_events:rate6h{slo="checkout-success"} * 21600 >= 50
        for: 15m
        labels:
          severity: page
          slo: checkout-success
          journey: checkout
          tier: slow
          burn_rate: "5.6"
        annotations:
          summary: "Checkout success: error budget burning at 5.6x over 6h and 30m"
          description: Error ratio above 0.028 (burn rate 5.6 x budget 0.005) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours.
          runbook: docs/runbooks/psp-outage.md
          dashboard: outlet-checkout
          spec_row: T8 Checkout
      - alert: SLONoDataCheckoutSuccess
        expr: absent_over_time(slo:sli_events:rate5m{slo="checkout-success"}[1h])
        for: 5m
        labels:
          severity: ticket
          slo: checkout-success
          journey: checkout
          tier: absent
        annotations:
          summary: "Checkout success: no SLI data for 1h"
          description: The SLI produced no events for an hour. Either traffic stopped or instrumentation broke; the burn-rate alerts are blind until this is resolved.
          runbook: docs/runbooks/psp-outage.md
          dashboard: outlet-checkout
          spec_row: T8 Checkout
