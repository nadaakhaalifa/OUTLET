  - name: slo-api-read-latency-alerts
    rules:
      - alert: SLOFastBurnApiReadLatency
        expr: |-
          slo:sli_error:ratio_rate1h{slo="api-read-latency"} > 0.672
            and
          slo:sli_error:ratio_rate5m{slo="api-read-latency"} > 0.672
            and
          slo:sli_events:rate1h{slo="api-read-latency"} * 3600 >= 500
        for: 2m
        labels:
          severity: page
          slo: api-read-latency
          journey: api
          tier: fast
          burn_rate: "13.44"
        annotations:
          summary: "API read latency: error budget burning at 13.44x over 1h and 5m"
          description: Error ratio above 0.672 (burn rate 13.44 x budget 0.05) on both the 1h and 5m windows. At this rate the 28d budget is gone in 50 hours.
          runbook: docs/runbooks/incident-response.md
          dashboard: outlet-api
          spec_row: T8 API
      - alert: SLOSlowBurnApiReadLatency
        expr: |-
          slo:sli_error:ratio_rate6h{slo="api-read-latency"} > 0.28
            and
          slo:sli_error:ratio_rate30m{slo="api-read-latency"} > 0.28
            and
          slo:sli_events:rate6h{slo="api-read-latency"} * 21600 >= 500
        for: 15m
        labels:
          severity: ticket
          slo: api-read-latency
          journey: api
          tier: slow
          burn_rate: "5.6"
        annotations:
          summary: "API read latency: error budget burning at 5.6x over 6h and 30m"
          description: Error ratio above 0.28 (burn rate 5.6 x budget 0.05) on both the 6h and 30m windows. At this rate the 28d budget is gone in 120 hours.
          runbook: docs/runbooks/incident-response.md
          dashboard: outlet-api
          spec_row: T8 API
      - alert: SLONoDataApiReadLatency
        expr: absent_over_time(slo:sli_events:rate5m{slo="api-read-latency"}[1h])
        for: 5m
        labels:
          severity: ticket
          slo: api-read-latency
          journey: api
          tier: absent
        annotations:
          summary: "API read latency: no SLI data for 1h"
          description: The SLI produced no events for an hour. Either traffic stopped or instrumentation broke; the burn-rate alerts are blind until this is resolved.
          runbook: docs/runbooks/incident-response.md
          dashboard: outlet-api
          spec_row: T8 API
