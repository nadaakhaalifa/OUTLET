      operationId: quoteCheckout
      summary: "Price the bag (pure): every fee on the first render, signed 10-minute price lock"
      tags:
        - Checkout
      security:
        - shopperJwt: []
      parameters:
        - $ref: "#/components/parameters/Market"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote_token:
                    type: string
                    maxLength: 2000
                  expires_at:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  currency:
                    type: string
                    pattern: ^[A-Z]{3}$
                  stores:
                    maxItems: 50
                    type: array
                    items:
                      type: object
                      properties:
                        store_id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        items_subtotal:
                          type: object
                          properties:
                            amount_minor:
                              type: string
                              pattern: ^-?[0-9]{1,19}$
                            currency:
                              type: string
                              pattern: ^[A-Z]{3}$
                          required:
                            - amount_minor
                            - currency
                          additionalProperties: false
                        shipping:
                          type: object
                          properties:
                            amount_minor:
                              type: string
                              pattern: ^-?[0-9]{1,19}$
                            currency:
                              type: string
                              pattern: ^[A-Z]{3}$
                          required:
                            - amount_minor
                            - currency
                          additionalProperties: false
                        parcels:
                          maxItems: 50
                          type: array
                          items:
                            type: object
                            properties:
                              store_id:
                                type: string
                                format: uuid
                                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                              quote_ref:
                                type: string
                                maxLength: 500
                              fee:
                                type: object
                                properties:
                                  amount_minor:
                                    type: string
                                    pattern: ^-?[0-9]{1,19}$
                                  currency:
                                    type: string
                                    pattern: ^[A-Z]{3}$
                                required:
                                  - amount_minor
                                  - currency
                                additionalProperties: false
                              days_min:
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                              days_max:
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                            required:
                              - store_id
                              - quote_ref
                              - fee
                              - days_min
                              - days_max
                            additionalProperties: false
                      required:
                        - store_id
                        - items_subtotal
                        - shipping
                        - parcels
                      additionalProperties: false
                  items_subtotal:
                    type: object
                    properties:
                      amount_minor:
                        type: string
                        pattern: ^-?[0-9]{1,19}$
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                    required:
                      - amount_minor
                      - currency
                    additionalProperties: false
                  discount:
                    type: object
                    properties:
                      amount_minor:
                        type: string
                        pattern: ^-?[0-9]{1,19}$
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                    required:
                      - amount_minor
                      - currency
                    additionalProperties: false
                  shipping:
                    type: object
                    properties:
                      amount_minor:
                        type: string
                        pattern: ^-?[0-9]{1,19}$
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                    required:
                      - amount_minor
                      - currency
                    additionalProperties: false
                  vat_included:
                    type: object
                    properties:
                      amount_minor:
                        type: string
                        pattern: ^-?[0-9]{1,19}$
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                    required:
                      - amount_minor
                      - currency
                    additionalProperties: false
                  store_credit:
                    type: object
                    properties:
                      amount_minor:
                        type: string
                        pattern: ^-?[0-9]{1,19}$
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                    required:
                      - amount_minor
                      - currency
                    additionalProperties: false
                  total:
                    type: object
                    properties:
                      amount_minor:
                        type: string
                        pattern: ^-?[0-9]{1,19}$
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                    required:
                      - amount_minor
                      - currency
                    additionalProperties: false
                  verified_savings:
                    type: object
                    properties:
                      amount_minor:
                        type: string
                        pattern: ^-?[0-9]{1,19}$
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                    required:
                      - amount_minor
                      - currency
                    additionalProperties: false
                  fees:
                    maxItems: 200
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          maxLength: 500
                        amount:
                          type: object
                          properties:
                            amount_minor:
                              type: string
                              pattern: ^-?[0-9]{1,19}$
                            currency:
                              type: string
                              pattern: ^[A-Z]{3}$
                          required:
                            - amount_minor
                            - currency
                          additionalProperties: false
                      required:
                        - code
                        - amount
                      additionalProperties: false
                  payment_options:
                    maxItems: 20
                    type: array
                    items:
                      type: object
                      properties:
                        method:
                          type: string
                          maxLength: 50
                        available:
                          type: boolean
                        payable:
                          type: object
                          properties:
                            amount_minor:
                              type: string
                              pattern: ^-?[0-9]{1,19}$
                            currency:
                              type: string
                              pattern: ^[A-Z]{3}$
                          required:
                            - amount_minor
                            - currency
                          additionalProperties: false
                      required:
                        - method
                        - available
                        - payable
                      additionalProperties: false
                  cod_allowed:
                    type: boolean
                  notices:
                    maxItems: 50
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          const: unavailable
                        line_id:
                          type: "null"
                      required:
                        - code
                        - line_id
                      additionalProperties: false
                  quote_echo:
                    $ref: "#/$defs/__schema0"
                required:
                  - quote_token
                  - expires_at
                  - currency
                  - stores
                  - items_subtotal
                  - discount
                  - shipping
                  - vat_included
                  - store_credit
                  - total
                  - verified_savings
                  - fees
                  - payment_options
                  - cod_allowed
                  - notices
                  - quote_echo
                additionalProperties: false
                $defs:
                  __schema0:
                    anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                      - type: "null"
                      - type: array
                        items:
                          $ref: "#/$defs/__schema0"
                      - type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          $ref: "#/$defs/__schema0"
        "400":
          description: Malformed request or unknown field (strict DTO).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, invalid, expired or other-market token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Wrong role, missing passkey or reason code.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found or not owned.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limited; Retry-After is set.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Timeout, dependency down or kill switch.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      x-authz:
        action: checkout.place
        principal: shopper
        tenant: user
      x-rate-limit:
        - budget: shopper_write
          key: user
          limit: 30
          window_s: 60
          layer: app
          source: default
      x-max-queries: 20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                payment_method:
                  type: string
                  enum:
                    - card
                    - apple_pay
                    - meeza
                    - mobile_wallet
                    - instapay
                    - fawry
                    - bnpl
                    - cod
                bnpl_provider:
                  type: string
                  maxLength: 500
                voucher_codes:
                  maxItems: 50
                  type: array
                  items:
                    type: string
                    maxLength: 500
                store_credit:
                  type: object
                  properties:
                    amount_minor:
                      type: string
                      pattern: ^-?[0-9]{1,19}$
                    currency:
                      type: string
                      pattern: ^[A-Z]{3}$
                  required:
                    - amount_minor
                    - currency
                  additionalProperties: false
                cart_line_ids:
                  maxItems: 50
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              required:
                - address_id
                - payment_method
              additionalProperties: false
      x-idempotency:
        header: none
        reason: "pure quote: reads the bag and signs a token, writes nothing"
  /v1/{market}/deals:
    get:
      operationId: listDeals
      summary: "Discover deals: products in one verified-discount band"
      tags:
        - Village
      security: []
      parameters:
        - $ref: "#/components/parameters/Market"
