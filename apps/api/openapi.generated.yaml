                          type: object
                          properties:
                            current_price:
                              type: object
                              properties:
                                amount_minor:
                                  type: string
                                  pattern: ^-?[0-9]{1,19}$
                                currency:
                                  type: string
                                  pattern: ^[A-Z]{3}$
                              required:
                                - amount_minor
                                - currency
