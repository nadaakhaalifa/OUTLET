                          maxLength: 500
                        title_en:
                          anyOf:
                            - type: string
                              maxLength: 500
                            - type: "null"
                        image:
                          anyOf:
                            - type: object
                              properties:
                                media_id:
                                  type: string
                                url:
                                  type: string
                                width:
                                  anyOf:
                                    - type: integer
