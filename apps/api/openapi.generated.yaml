components:
  securitySchemes:
    shopperJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access JWT (ES256, 10 min, audience outlet:{market}, amr claim).
    sellerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Same user token; seller routes also need a passkey in amr, an active store membership for X-Store-Id and a role allowed by x-authz.
    adminPasskeySession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Same user token; admin routes also need a passkey in amr and a live role grant or approved elevation allowed by x-authz (super_admin only with break-glass).
  parameters:
    Market:
      name: market
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z]{2}(-[a-z0-9]{2,3})?$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Client UUIDv7 minted within ±24 h. Same key + other body → 422; in flight → 409; replay → stored response with Idempotent-Replayed: true."
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    StoreScope:
      name: X-Store-Id
      in: header
      required: true
      description: Active store; not a member → 404.
      schema:
        type: string
        format: uuid
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Install id (UUID) used as a rate-limit key.
      schema:
        type: string
        format: uuid
    ReasonCode:
      name: X-Reason-Code
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z_]{3,40}(:[A-Za-z0-9-]{1,40})?$
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from next_cursor. No OFFSET.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size 1-50 (default 20).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details. No stack traces.
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        request_id:
          type: string
        detail:
          type: string
        retry_after_s:
          type: integer
        errors:
          type: array
          maxItems: 50
          items:
            type: object
            required:
              - path
              - code
            properties:
              path:
                type: string
              code:
                type: string
              message_key:
                type: string
