                  resend_after_s:
                    type: integer
                    minimum: 1
                    maximum: 9007199254740991
                  channel:
                    type: string
                    const: sms
                required:
                  - challenge_id
                  - expires_at
                  - resend_after_s
                  - channel
                additionalProperties: false
        "400":
          description: Malformed request or unknown field (strict DTO).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found or not owned.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Idempotency key in flight or state conflict.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Idempotency key reused with another body, or a business rule.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limited; Retry-After is set.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Timeout, dependency down or kill switch.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      x-authz:
        principal: anonymous
        tenant: none
      x-rate-limit:
        - budget: otp_request_device
          key: device
          limit: 10
          window_s: 86400
          layer: app
          source: build-prompt
      x-max-queries: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
