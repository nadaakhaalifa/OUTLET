                              type: object
                              properties:
                                amount_minor:
                                  type: string
                                  pattern: ^-?[0-9]{1,19}$
                                currency:
                                  type: string
                                  pattern: ^[A-Z]{3}$
                              required:
                                - amount_minor
                                - currency
                              additionalProperties: false
                            display_discount_bp:
                              type: integer
                              minimum: 0
                              maximum: 10000
                            member_discount_bp:
                              type: integer
                              minimum: 0
                              maximum: 10000
                            evidence_checked_at:
                              type: string
                            price_proof_path:
                              type: string
