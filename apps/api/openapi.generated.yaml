                                    - type: integer
                                      minimum: -9007199254740991
                                      maximum: 9007199254740991
                                    - type: "null"
                                blurhash:
                                  type:
                                    - string
                                    - "null"
                                alt_ar:
                                  type:
                                    - string
                                    - "null"
                                alt_en:
                                  type:
                                    - string
                                    - "null"
                              required:
                                - media_id
                                - url
                              additionalProperties: false
                            - type: "null"
                        condition_grade_code:
                          type: string
                          maxLength: 500
                        defect_count:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
