                  type: string
                  pattern: ^\+[1-9][0-9]{7,14}$
                channel:
                  type: string
                  enum:
                    - sms
                    - whatsapp
                purpose:
                  type: string
                  enum:
                    - sign_in
                    - register
                    - step_up
              required:
