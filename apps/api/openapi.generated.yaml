                            - current_price
                            - claim_type
                            - price_proof_path
                          additionalProperties: false
                        availability:
                          type: string
                          enum:
                            - in_stock
                            - low_stock
                            - out_of_stock
                        canonical_path:
                          type: string
                          maxLength: 500
                      required:
                        - product_id
                        - sku_id
                        - store_id
                        - store_slug
                        - title_ar
                        - image
                        - condition_grade_code
                        - defect_count
                        - price
                        - canonical_path
                      additionalProperties: false
                  next_cursor:
                    anyOf:
                      - type: string
                        maxLength: 512
                      - type: "null"
                required:
                  - items
                  - next_cursor
                additionalProperties: false
        "400":
          description: Malformed request or unknown field (strict DTO).
          content:
