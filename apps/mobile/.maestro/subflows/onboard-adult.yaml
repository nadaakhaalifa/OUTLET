# Onboards a fresh adult user via phone OTP + DOB. Expects a cleared app state.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    id: "phone-input"
- inputText: ${ADULT_PHONE}
- tapOn: ${PHONE_SEND}
- tapOn:
    id: "otp-input"
- inputText: ${OTP_CODE}
- tapOn: ${OTP_VERIFY}
- tapOn:
    id: "dob-day"
- inputText: ${ADULT_DOB_DAY}
- tapOn:
    id: "dob-month"
- inputText: ${ADULT_DOB_MONTH}
- tapOn:
    id: "dob-year"
- inputText: ${ADULT_DOB_YEAR}
- hideKeyboard
- tapOn:
    id: "dob-attest"
- tapOn: ${DOB_SUBMIT}
- runFlow:
    when:
      visible: ${LANG_BUTTON}
    commands:
      - tapOn: ${LANG_BUTTON}
- tapOn: ${CONSENTS_SKIP}
- tapOn: ${WELCOME_START}
- assertVisible:
    id: "tab-home"