    purge_job: device_local_cleanup
    purge_metric: device_local_cleanup_total
    source: proposed
    verify: false
  technical_dedup:
    description: Outbox, inbox and idempotency rows, deleted after a short window once relayed or expired.
    period: {value: 30, unit: days}
    trigger: collection
    after: delete
    purge_job: purge_technical_dedup
    purge_metric: privacy_technical_dedup_purged_total
    source: proposed
    verify: true
    note: Window is an engineering proposal; the idempotency expires_at column can be shorter.
  stock_reservation_records:
    description: Reservations and their lines after resolution (claimed, released, expired). The order keeps the legal record.
    period: {value: 90, unit: days}
    trigger: collection
    after: delete
    purge_job: purge_resolved_reservations
    purge_metric: inventory_reservations_purged_total
    source: proposed
    spec_ref: "docs/data-model/inventory.md Entities"
    verify: true
  stock_unit_rows:
    description: Claimed and written-off unit rows. Operational only; the order line keeps the truth.
    period: {value: 13, unit: months}
    trigger: collection
    after: delete
    purge_job: purge_claimed_units
    purge_metric: inventory_units_purged_total
    source: proposed
    spec_ref: "docs/data-model/inventory.md Entities"
    verify: true
  stock_movement_evidence:
    description: Adjustments and oversell events. Support tax and dispute evidence for stock movements.
    period: {value: 7, unit: years}
    trigger: collection
    after: delete
    purge_job: purge_stock_movements
    purge_metric: inventory_movements_purged_total
    source: proposed
    spec_ref: "docs/data-model/inventory.md Entities"
    verify: true

  catalog_import_records:
    description: Catalog CSV import jobs, per-row error reports and import product refs after completion. The product itself is governed by catalog_content.
    period: {value: 90, unit: days}
    trigger: collection
    after: delete
    purge_job: purge_catalog_import_records
    purge_metric: catalog_import_records_purged_total
    source: proposed
    spec_ref: "docs/specs/catalog.md section 4"
    verify: true

tables:
  # ---------------------------------------------------------------- identity (section 1)
  - name: users
    spec_ref: "1 Data"
    source: spec_named
    data_subjects: [shopper]
    defaults: {purpose: [account_auth], lawful_basis: contract, retention: account_active, processors: [cloud_primary], residency: approved_region, on_erasure: delete}
    fields:
      - {name: country, pii_class: P2, encryption: none, note: "Migration 0006 column. Default EG."}
      - {name: age_attested_18_at, pii_class: P2, encryption: none, purpose: [age_assurance], note: "Migration 0006 stores only the 18+ attestation timestamp, not the DOB (spec B6). dob above is added by a later expand migration."}
      - {name: updated_at, pii_class: P1, encryption: none}
      - {name: deleted_at, pii_class: P2, encryption: none, on_erasure: retain_legal, note: "Tombstone timestamp after account deletion."}
      - {name: id, pii_class: P2, encryption: none, note: "Pseudonymous account identifier, still personal data."}
      - {name: phone_e164, pii_class: P3, encryption: field_envelope, residency: in_country, processors: [cloud_primary, sms_provider, whatsapp_bsp], note: "Spec marks P3-enc. One account per phone."}
      - {name: phone_hash, pii_class: P2, encryption: blind_index_hmac, note: "HMAC blind index for lookup, key in KMS."}
      - {name: email, pii_class: P2, encryption: field_envelope, processors: [cloud_primary, email_provider], note: "Spec marks P2-enc. Apple private-relay addresses are valid."}
      - {name: dob, pii_class: P3, encryption: field_envelope, residency: in_country, purpose: [age_assurance], verify: true, note: "Basis depends on the age of majority (open question 6)."}
      - {name: age_band, pii_class: P2, encryption: none, purpose: [age_assurance]}
      - {name: dob_ciphertext, pii_class: P3, encryption: field_envelope, residency: in_country, purpose: [age_assurance], verify: true, note: "Migration 0047: envelope-encrypted DOB copied from the age pass at sign-up. Column for the dob field above."}
      - {name: email_ciphertext, pii_class: P2, encryption: field_envelope, note: "Migration 0047: envelope-encrypted e-mail from a verified Apple or Google identity."}
      - {name: limited_capacity, pii_class: P2, encryption: none, purpose: [age_assurance], note: "Set for ages 18 to 20 (spec B6)."}
      - {name: locale, pii_class: P2, encryption: none}
      - {name: status, pii_class: P1, encryption: none}
      - {name: created_at, pii_class: P1, encryption: none}

  - name: identities
    spec_ref: "1 Data"
    source: spec_named
    data_subjects: [shopper]
    defaults: {purpose: [account_auth], lawful_basis: contract, retention: account_active, processors: [cloud_primary, identity_providers], residency: approved_region, on_erasure: delete}
    fields:
      - {name: id, pii_class: P1, encryption: none}
      - {name: subject_ciphertext, pii_class: P2, encryption: field_envelope, note: "Migration 0006: provider subject or phone, envelope-encrypted."}
      - {name: subject_hash, pii_class: P2, encryption: blind_index_hmac, note: "HMAC blind index, unique per provider."}
      - {name: verified, pii_class: P1, encryption: none}
      - {name: last_authenticated_at, pii_class: P2, encryption: none}
      - {name: created_at, pii_class: P1, encryption: none}
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: provider, pii_class: P1, encryption: none}
      - {name: subject, pii_class: P2, encryption: none, note: "Apple or Google subject id; may be a private relay."}

  - name: devices
    spec_ref: "1 Data"
    source: spec_named
    data_subjects: [shopper]
    defaults: {purpose: [account_auth], lawful_basis: contract, retention: device_records, processors: [cloud_primary, app_attestation], residency: approved_region, on_erasure: delete}
    fields:
      - {name: install_id, pii_class: P2, encryption: none, note: "Random per install, still a device identifier (migration 0006 comment: P2)."}
      - {name: attested_at, pii_class: P1, encryption: none}
      - {name: app_version, pii_class: P1, encryption: none}
      - {name: first_seen, pii_class: P1, encryption: none}
      - {name: id, pii_class: P2, encryption: none, note: "Device identifier."}
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: platform, pii_class: P1, encryption: none}
      - {name: attest_status, pii_class: P1, encryption: none}
      - {name: push_token, pii_class: P2, encryption: none, purpose: [transactional_comms], processors: [cloud_primary, push_service]}
      - {name: last_seen, pii_class: P1, encryption: none}
      - {name: install_secret_hash, pii_class: P2, encryption: one_way_hash, note: "Migration 0092 (dashboard-foundations track 1): SHA-256 of the server-minted admin-web browser install token; web rows only. The token itself is never stored or logged. Cleared when a newer login revokes the device. Binds a session to a cookie jar; it is not device trust."}

  - name: sessions
    spec_ref: "1 Data"
    source: spec_named
    data_subjects: [shopper]
    defaults: {purpose: [account_auth], lawful_basis: contract, retention: auth_credentials, processors: [cloud_primary], residency: approved_region, on_erasure: delete}
    fields:
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: rotation_no, pii_class: P1, encryption: none}
      - {name: amr, pii_class: P1, encryption: none}
      - {name: used_at, pii_class: P1, encryption: none}
      - {name: created_at, pii_class: P1, encryption: none}
      - {name: id, pii_class: P1, encryption: none}
      - {name: device_id, pii_class: P2, encryption: none}
      - {name: refresh_hash, pii_class: P2, encryption: one_way_hash, note: "Hash of an opaque device-bound token."}
      - {name: family_id, pii_class: P1, encryption: none}
      - {name: expires_at, pii_class: P1, encryption: none}
      - {name: revoked_at, pii_class: P1, encryption: none}

  - name: otp_challenges
    spec_ref: "1 Rules"
    source: derived
    data_subjects: [shopper]
    defaults: {purpose: [account_auth], lawful_basis: contract, retention: auth_credentials, processors: [cloud_primary, sms_provider, whatsapp_bsp], residency: approved_region, on_erasure: delete}
    fields:
      - {name: id, pii_class: P1, encryption: none}
      - {name: phone_hash, pii_class: P2, encryption: blind_index_hmac}
      - {name: device_id, pii_class: P2, encryption: none}
      - {name: code_hash, pii_class: P1, encryption: one_way_hash, note: "6 digit code, valid 5 minutes, 5 attempts."}
      - {name: channel, pii_class: P1, encryption: none}
      - {name: attempts, pii_class: P1, encryption: none}
      - {name: sent_at, pii_class: P1, encryption: none}
      - {name: expires_at, pii_class: P1, encryption: none}
      - {name: phone_ciphertext, pii_class: P3, encryption: field_envelope, residency: in_country, note: "Migration 0047: needed to bind the code hash to the phone; envelope-encrypted, expires with the challenge."}
      - {name: device_key_hash, pii_class: P2, encryption: blind_index_hmac, note: "Migration 0047: HMAC of the attested device key; the code only verifies from the device it was sent for."}
      - {name: salt, pii_class: P1, encryption: none}
      - {name: issued_at, pii_class: P1, encryption: none}
      - {name: status, pii_class: P1, encryption: none}

  - name: age_attestations
    spec_ref: "1 Data (columns not listed in spec)"
    source: derived
    data_subjects: [shopper]
    defaults: {purpose: [age_assurance], lawful_basis: contract, retention: consent_evidence, processors: [cloud_primary], residency: approved_region, on_erasure: pseudonymize, verify: true}
    fields:
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: attested_at, pii_class: P1, encryption: none}
      - {name: attestation_version, pii_class: P1, encryption: none}
      - {name: age_policy_version, pii_class: P1, encryption: none}

  - name: age_block_devices
    spec_ref: "1 Rules (under-18 soft block)"
    source: derived
    data_subjects: [visitor]
    defaults: {purpose: [age_assurance], lawful_basis: contract, retention: underage_block, processors: [cloud_primary], residency: in_country, on_erasure: delete}
    fields:
      - {name: device_hash, pii_class: P2, encryption: one_way_hash}
      - {name: dob_hash, pii_class: P3, encryption: blind_index_hmac, note: "Keyed HMAC, never a plain hash: a DOB has little entropy."}
      - {name: blocked_until, pii_class: P1, encryption: none}

  - name: auth_sessions
    spec_ref: "1 Data (sessions: access token sid)"
    source: derived
    data_subjects: [shopper]
    defaults: {purpose: [account_auth], lawful_basis: contract, retention: auth_credentials, processors: [cloud_primary], residency: approved_region, on_erasure: delete}
    fields:
      - {name: id, pii_class: P1, encryption: none, note: "Migration 0047: the sid claim of the access token."}
      - {name: family_id, pii_class: P1, encryption: none}
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: device_id, pii_class: P2, encryption: none}
      - {name: platform, pii_class: P1, encryption: none}
      - {name: amr, pii_class: P1, encryption: none}
      - {name: created_at, pii_class: P1, encryption: none}
      - {name: last_used_at, pii_class: P1, encryption: none}
      - {name: revoked_at, pii_class: P1, encryption: none}
      - {name: uv, pii_class: P1, encryption: none, note: "Migration 0092: true only when a passkey assertion with user verification opened the session. A session property, not biometric data."}
      - {name: device_key_hash, pii_class: P2, encryption: blind_index_hmac, note: "Migration 0099: HMAC of the attested device key the session was opened from; the recycled-number step-up treats a device as known only when this matches (null = not known). Purging the row removes that evidence (see retention note)."}

  - name: otp_send_log
    spec_ref: "1 Rules (3 sends per 15 min per phone, 10 per day per device)"
    source: derived
    data_subjects: [shopper, visitor]
    defaults: {purpose: [account_auth, fraud_prevention], lawful_basis: legitimate_interest, retention: auth_credentials, processors: [cloud_primary], residency: approved_region, on_erasure: delete, verify: true}
    fields:
      - {name: id, pii_class: P1, encryption: none}
      - {name: phone_hash, pii_class: P2, encryption: blind_index_hmac}
      - {name: device_hash, pii_class: P2, encryption: blind_index_hmac}
      - {name: sent_at, pii_class: P1, encryption: none, note: "Rows older than 2 days are deleted on every insert."}

  - name: age_gate_blocks
    spec_ref: "1 Rules (under-18 soft block 30 days)"
    source: derived
    data_subjects: [visitor]
    defaults: {purpose: [age_assurance], lawful_basis: contract, retention: underage_block, processors: [cloud_primary], residency: in_country, on_erasure: delete}
    fields:
      - {name: key_hash, pii_class: P2, encryption: blind_index_hmac, note: "Migration 0047: HMAC identifier of the attested device, the device id hash or the DOB. Never a plain hash."}
      - {name: blocked_until, pii_class: P1, encryption: none}

  - name: age_gate_passes
    spec_ref: "1 Flow (DOB step before sign-in; pass valid 24 h)"
    source: derived
    data_subjects: [visitor]
    defaults: {purpose: [age_assurance], lawful_basis: contract, retention: auth_credentials, processors: [cloud_primary], residency: in_country, on_erasure: delete}
    fields:
      - {name: key_hash, pii_class: P2, encryption: blind_index_hmac}
      - {name: expires_at, pii_class: P1, encryption: none}
      - {name: age_band, pii_class: P2, encryption: none, purpose: [age_assurance]}
      - {name: dob_ciphertext, pii_class: P3, encryption: field_envelope, residency: in_country, purpose: [age_assurance], note: "Held at most 24 h, then copied to users.dob_ciphertext at sign-up; expired rows are deleted on every insert."}

  - name: auth_nonces
    spec_ref: "1 Security (Apple and Google nonce replay)"
    source: derived
    data_subjects: [shopper]
    defaults: {purpose: [account_auth], lawful_basis: contract, retention: auth_credentials, processors: [cloud_primary], residency: approved_region, on_erasure: delete}
    fields:
      - {name: key_hash, pii_class: P2, encryption: one_way_hash, note: "provider:SHA-256 of the client nonce."}
      - {name: expires_at, pii_class: P1, encryption: none}

  - name: passkey_challenges
    spec_ref: "T5 Identity (passkeys)"
    source: derived
    data_subjects: [shopper]
    defaults: {purpose: [account_auth], lawful_basis: contract, retention: auth_credentials, processors: [cloud_primary], residency: approved_region, on_erasure: delete}
    fields:
      - {name: id, pii_class: P1, encryption: none}
      - {name: challenge, pii_class: P1, encryption: none, note: "Random single-use WebAuthn challenge, TTL 5 minutes."}
      - {name: purpose, pii_class: P1, encryption: none}
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: expires_at, pii_class: P1, encryption: none}

  - name: passkey_credentials
    spec_ref: "T5 Identity (passkeys)"
    source: derived
    data_subjects: [shopper]
    defaults: {purpose: [account_auth], lawful_basis: contract, retention: account_active, processors: [cloud_primary], residency: approved_region, on_erasure: delete}
    fields:
      - {name: credential_id, pii_class: P2, encryption: none}
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: public_key, pii_class: P2, encryption: none, note: "COSE public key, base64url. Not a secret."}
      - {name: sign_count, pii_class: P1, encryption: none, note: "Clone detection counter."}
      - {name: status, pii_class: P1, encryption: none}
      - {name: backup_eligible, pii_class: P1, encryption: none}
      - {name: backed_up, pii_class: P1, encryption: none}
      - {name: created_at, pii_class: P1, encryption: none}

  - name: consent_records
    spec_ref: "B1 Build requirements"
    source: spec_named
    data_subjects: [shopper]
    defaults: {purpose: [consent_management], lawful_basis: legal_obligation, retention: consent_evidence, processors: [cloud_primary], residency: approved_region, on_erasure: pseudonymize, verify: true}
    fields:
      - {name: id, pii_class: P1, encryption: none}
      - {name: subject_type, pii_class: P1, encryption: none, note: "Migration 0006: consent may precede registration, so the subject is a user or a device."}
      - {name: subject_id, pii_class: P2, encryption: none}
      - {name: occurred_at, pii_class: P1, encryption: none, note: "Migration 0006 name for ts."}
      - {name: app_version, pii_class: P1, encryption: none}
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: purpose, pii_class: P1, encryption: none}
      - {name: version, pii_class: P1, encryption: none}
      - {name: granted, pii_class: P1, encryption: none}
      - {name: method, pii_class: P1, encryption: none}
      - {name: ts, pii_class: P1, encryption: none}
      - {name: ip_hash, pii_class: P2, encryption: one_way_hash}
      - {name: seq, pii_class: P1, encryption: none, note: "Migration 0006: identity ordering so the latest consent per purpose is unambiguous."}

  # ---------------------------------------------------------------- privacy center (section 2, B1)
  - name: dsar_requests
    spec_ref: "2 API, B1"
    source: derived
    data_subjects: [shopper]
    defaults: {purpose: [privacy_rights], lawful_basis: legal_obligation, retention: dsar_records, processors: [cloud_primary], residency: approved_region, on_erasure: retain_legal, verify: true}
    fields:
      - {name: id, pii_class: P1, encryption: none}
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: kind, pii_class: P1, encryption: none}
      - {name: status, pii_class: P1, encryption: none}
      - {name: requested_at, pii_class: P1, encryption: none}
      - {name: due_at, pii_class: P1, encryption: none}
      - {name: completed_at, pii_class: P1, encryption: none}
      - {name: export_object_ref, pii_class: P2, encryption: none, retention: dsar_export_artifact, note: "Pointer to the ZIP holding all P2/P3 data of the user; object is access-controlled and expires."}
      - {name: locale, pii_class: P1, encryption: none, note: "Language of the export README and notification, ar or en."}
      - {name: ready_target_at, pii_class: P1, encryption: none, note: "Exports only: request time plus 72 hours (spec B1 product target)."}
      - {name: cooling_ends_at, pii_class: P1, encryption: none, note: "Deletions only: request time plus 14 days."}
      - {name: forfeited_credit_amount, pii_class: P2, encryption: none, note: "Store-credit balance in piastres the user acknowledged forfeiting. Financial data about the user."}
      - {name: blockers, pii_class: P1, encryption: none, note: "Blocker kind and count only (open_orders, open_returns, open_disputes), no identifiers."}
      - {name: attempts, pii_class: P1, encryption: none}
      - {name: failure_code, pii_class: P1, encryption: none, note: "Machine code, never free text."}
      - {name: cancelled_at, pii_class: P1, encryption: none}
      - {name: artifact_expires_at, pii_class: P1, encryption: none, retention: dsar_export_artifact, note: "Artifact kept 7 days; signed URLs live 24 hours."}
      - {name: version, pii_class: P1, encryption: none, note: "Optimistic concurrency counter."}
      - {name: updated_at, pii_class: P1, encryption: none}

  - name: breach_register
    spec_ref: "B1 Breach response"
    source: derived
    data_subjects: [shopper]
    defaults: {purpose: [privacy_rights], lawful_basis: legal_obligation, retention: dsar_records, processors: [cloud_primary], residency: approved_region, verify: true}
    fields:
      - {name: id, pii_class: P1, encryption: none}
      - {name: detected_at, pii_class: P1, encryption: none}
      - {name: severity, pii_class: P1, encryption: none}
      - {name: summary, pii_class: P1, encryption: none, note: "Must not contain personal data."}
      - {name: affected_count, pii_class: P1, encryption: none}
      - {name: pdpc_notified_at, pii_class: P1, encryption: none}
      - {name: subjects_notified_at, pii_class: P1, encryption: none}
      - {name: dpo_decision, pii_class: P1, encryption: none}
      - {name: status, pii_class: P1, encryption: none, note: "detected, triaged, pdpc_notified, subjects_notified or closed."}
      - {name: triaged_at, pii_class: P1, encryption: none}
      - {name: closed_at, pii_class: P1, encryption: none}
      - {name: version, pii_class: P1, encryption: none, note: "Optimistic concurrency counter."}
      - {name: created_at, pii_class: P1, encryption: none}
      - {name: updated_at, pii_class: P1, encryption: none}

  - name: breach_affected_subjects
    spec_ref: "B1 Breach response"
    source: derived
    data_subjects: [shopper]
    defaults: {purpose: [privacy_rights], lawful_basis: legal_obligation, retention: dsar_records, processors: [cloud_primary], residency: approved_region, on_erasure: retain_legal, verify: true}
    fields:
      - {name: breach_id, pii_class: P1, encryption: none}
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: notified_at, pii_class: P1, encryption: none}

  - name: transfer_register
    spec_ref: "B1 DPO dashboard"
    source: derived
    data_subjects: [staff]
    defaults: {purpose: [privacy_rights], lawful_basis: legal_obligation, retention: dsar_records, processors: [cloud_primary], residency: approved_region, verify: true}
    fields:
      - {name: id, pii_class: P1, encryption: none}
      - {name: processor_id, pii_class: P1, encryption: none}
      - {name: destination_country, pii_class: P1, encryption: none}
      - {name: mechanism, pii_class: P1, encryption: none}
      - {name: licence_ref, pii_class: P1, encryption: none}
      - {name: tia_ref, pii_class: P1, encryption: none}
      - {name: approved_at, pii_class: P1, encryption: none}

  # ---------------------------------------------------------------- addresses and delivery data (section 7, B1, T5)
  - name: saved_addresses
    spec_ref: "7 Flow step 1, T5 crypto row; docs/specs/addresses.md; migration 0050"
    source: derived
    data_subjects: [shopper]
    description: Structured Egyptian address book. P3 fields are field-encrypted (AAD address:<id>:<field>); governorate and city are coarse and P2 so coverage can be checked. Deleting an address never touches delivery_snapshots.
    defaults: {purpose: [order_fulfilment], lawful_basis: contract, retention: account_active, processors: [cloud_primary], residency: in_country, on_erasure: delete}
    fields:
      - {name: id, pii_class: P1, encryption: none}
      - {name: user_id, pii_class: P2, encryption: none}
      - {name: label, pii_class: P1, encryption: none}
      - {name: recipient_name_enc, pii_class: P2, encryption: field_envelope}
      - {name: phone_enc, pii_class: P3, encryption: field_envelope}
      - {name: phone_blind, pii_class: P2, encryption: blind_index_hmac}
      - {name: governorate_code, pii_class: P2, encryption: none, residency: approved_region, verify: true}
      - {name: city_code, pii_class: P2, encryption: none, residency: approved_region, verify: true}
      - {name: street_enc, pii_class: P3, encryption: field_envelope}
      - {name: building_enc, pii_class: P3, encryption: field_envelope}
      - {name: floor_enc, pii_class: P3, encryption: field_envelope}
      - {name: apartment_enc, pii_class: P3, encryption: field_envelope}
      - {name: landmark_enc, pii_class: P3, encryption: field_envelope}
      - {name: map_pin_enc, pii_class: P3, encryption: field_envelope, consent_purpose: location_precise, lawful_basis: consent, note: "Precise map pin (lat/lng) in one envelope."}
      - {name: dedupe_blind, pii_class: P2, encryption: blind_index_hmac}
      - {name: courier_coverage, pii_class: P1, encryption: none}
      - {name: cod_eligible, pii_class: P1, encryption: none}
