# Z-OUTLET data inventory (spec name HAUL), spec B1 and T6.
#
# Single source of truth for personal-data tagging. Generated from this file:
#   docs/privacy/ropa.md, docs/privacy/processors-register.md, docs/privacy/retention-schedule.md
# Validated by: node tooling/privacy/check-inventory.mjs   (Zod, fails on untagged fields)
# Regenerate with: node tooling/privacy/generate-ropa.mjs
#
# STATUS: DRAFT, not reviewed by counsel or the DPO. Nothing here is legal advice.
# Every lawful basis, retention period and residency value below is an engineering
# proposal. Anything tagged verify: true is VERIFY BEFORE LAUNCH and is tracked in
# docs/compliance/verify-register.md. No real personal data may be processed until
# ADR-0002 is accepted.
#
# Conventions
#   pii_class describes the field's own content (spec section 1 Data row):
#     P0 public, P1 internal (non-personal operational data),
#     P2 personal, P3 sensitive (field-encrypted, in-country, never to external LLMs).
#     A table is personal data as a whole when it holds any P2/P3 field or a user key.
#   Surrogate row ids are P1. A column holding a user, device or subject identifier is P2.
#   pii_class and encryption are required on every field (never defaulted).
#   Other tags may be set once per table in `defaults` and overridden per field.
#   Global defaults: seller_visibility none, external_llm never,
#     dsar_export true for P2/P3, on_erasure not_personal for P0/P1.
#   residency: in_country (stays in Egypt, ADR-0002 option C target),
#     approved_region (the data plane region chosen by ADR-0002, no transfer outside it),
#     global_ok (P0 only), device_only (never leaves the handset).
#   source: spec_named = table is named in the master prompt, columns as listed there.
#           derived = table or columns inferred from spec prose; confirm when the ERD is final.

inventory_version: 1
last_reviewed: 2026-10-10
status: DRAFT_NOT_REVIEWED_BY_COUNSEL

consent_purposes:
  - marketing_push
  - marketing_whatsapp
  - marketing_email
  - analytics
  - personalization
  - budget_insights
  - measurements
  - location_precise
  - cross_border_ml

purposes:
  account_auth:
    title: Account, sign-in and session security
    description: Create and authenticate accounts (phone OTP, Apple, Google, passkey), keep sessions, detect abuse of sign-in.
  age_assurance:
    title: Age assurance and capability gating
    description: Enforce the 18+ account rule and the 21+ gates (spec B6) using a DOB and attestation.
  consent_management:
    title: Consent records
    description: Prove which consent was given or withdrawn, when and how (spec B1).
  catalog_browse:
    title: Catalog, search and saved browsing state
    description: Show products and stores, saved searches, favourite stores, carts and wishlists.
  order_fulfilment:
    title: Order placement and fulfilment
    description: Take, split and fulfil orders, including delivery details shared with sellers and couriers.
  payment_processing:
    title: Payment processing
    description: Initiate, confirm and reconcile payments through PSPs and BNPL providers. Card data stays with the PSP.
  wallet_ledger:
    title: Store credit, gift cards and ledger
    description: Closed-loop store credit, gift cards and the double-entry ledger (spec B2, T4).
  tax_accounting:
    title: Tax, invoicing and accounting records
    description: Keep order, invoice and financial records for the legal retention period (spec B4).
  delivery_logistics:
    title: Delivery and COD logistics
    description: Shipments, courier events, proof of delivery and COD remittance.
  returns_refunds:
    title: Returns, exchanges, refunds and disputes
    description: Handle returns with evidence, route refunds and settle disputes (spec 15.6, 22).
  customer_support:
    title: Customer support
    description: Tickets, chat and WhatsApp inbox conversations.
  personalization_stylist:
    title: Personalisation and AI stylist
    description: Outfit generation, style profile, recommendations, wardrobe and outfit calendar.
  fit_sizing:
    title: Size and fit advice
    description: Size profiles, measurements, fit feedback and fit model parameters (spec 10).
  budget_insights:
    title: Budget and affordability suite
    description: Opt-in budgets, cycles, instalment commitments and savings goals (spec 12).
  fraud_prevention:
    title: Fraud, abuse and risk scoring
    description: Device, IP, instrument and address graph, COD refusal history and risk scores (spec 20.7).
  marketing_comms:
    title: Marketing and notification preferences
    description: Marketing push, WhatsApp and email, only with the matching consent.
  transactional_comms:
    title: Transactional notifications
    description: Order, delivery and security messages that do not need marketing consent.
  analytics_product:
    title: Product analytics and crash reporting
    description: Pseudonymous events and crash reports, initialised only after the analytics consent.
  security_audit:
    title: Security logging and audit trail
    description: Hash-chained audit log, request logs and incident evidence.
  seller_onboarding_kyc:
    title: Seller and creator KYC and payouts
    description: Verify sellers and creators, screen sanctions lists, pay out to a verified IBAN.
  loyalty_referral:
    title: Rewards, referrals and creator program
    description: Coins, tiers, referral codes, affiliate attribution and commissions.
  subscriptions_plus:
    title: Plus, family and student plans
    description: Subscriptions, trials, family members and student verification.
  gifting:
    title: Gift cards and group gifts
    description: Purchase, send and redeem gift cards, corporate gifting and split payment pots.
  reviews_social:
    title: Reviews, Q and A and social features
    description: Verified-purchase reviews with photos, Q and A, follows, community looks and live chat.
  privacy_rights:
    title: Data subject rights and breach handling
    description: DSAR export and deletion queue, breach register and transfer register (spec B1).
  seller_platform_ops:
    title: Seller Center and Admin Console accounts
    description: Staff and seller-user accounts and access control.
  platform_reliability:
    title: Exactly-once processing and idempotency
    description: Outbox, inbox and idempotency keys that stop duplicate side effects (spec A2, T3).

