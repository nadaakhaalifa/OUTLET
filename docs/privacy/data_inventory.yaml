retention:
  account_active:
    description: Profile and account data while the account exists. After a deletion request and the 14-day cooling period, PII is erased or pseudonymized.
    period: null
    trigger: account_deletion
    after: erase_or_pseudonymize
    purge_job: purge_deleted_accounts
    purge_metric: privacy_accounts_purged_total
    source: spec
    spec_ref: 2 (Rules), B1
    verify: false
  orders_tax_records:
    description: Orders, invoices, ledger and financial records kept under legal retention, in pseudonymized form after account deletion.
    period: {value: 7, unit: years}
    trigger: order_close
    after: pseudonymize
    purge_job: purge_expired_tax_records
    purge_metric: privacy_tax_records_purged_total
    source: spec
    spec_ref: B1 Retention
    verify: true
    note: Spec says assume 5 to 7 years, tax-law period unverified. The upper bound is planned so nothing is deleted too early; counsel may shorten it.
  kyc_records:
    description: Seller and creator KYC documents and results, kept for the contract plus five years.
    period: {value: 5, unit: years}
    trigger: contract_end
    after: delete
    purge_job: purge_expired_kyc
    purge_metric: privacy_kyc_purged_total
    source: spec
    spec_ref: B1 Retention
    verify: true
  analytics_events:
    description: Pseudonymous analytics events, then aggregated.
    period: {value: 25, unit: months}
    trigger: collection
    after: aggregate
    purge_job: aggregate_analytics_events
    purge_metric: privacy_analytics_events_aggregated_total
    source: spec
    spec_ref: B1 Retention
    verify: false
  measurements:
    description: Body measurements and size profiles stay until the user deletes them or the account.
    period: null
    trigger: user_deletes
    after: delete
    purge_job: purge_deleted_measurements
    purge_metric: privacy_measurements_purged_total
    source: spec
    spec_ref: B1 Retention
    verify: false
  support_chats:
    description: Support tickets, chats and WhatsApp inbox threads.
    period: {value: 2, unit: years}
    trigger: collection
    after: delete
    purge_job: purge_support_chats
    purge_metric: privacy_support_chats_purged_total
    source: spec
    spec_ref: B1 Retention
    verify: false
  raw_webhooks_financial:
    description: Raw PSP and courier-financial webhook bodies kept as financial evidence.
    period: {value: 7, unit: years}
    trigger: collection
    after: delete
    purge_job: purge_raw_webhooks
    purge_metric: privacy_raw_webhooks_purged_total
    source: spec
    spec_ref: B1 Retention
    verify: true
  seller_access_window:
    description: Seller access to delivery data ends 30 days after delivery or return closure.
    period: {value: 30, unit: days}
    trigger: delivery_or_return_closure
    after: revoke_access
    purge_job: revoke_seller_delivery_access
    purge_metric: privacy_seller_access_revoked_total
    source: spec
    spec_ref: B1 Sellers row
    verify: false
  underage_block:
    description: Device and DOB hash kept so a different DOB cannot be retried on the same device for 30 days.
    period: {value: 30, unit: days}
    trigger: collection
    after: delete
    purge_job: purge_age_blocks
    purge_metric: privacy_age_blocks_purged_total
    source: spec
    spec_ref: 1 Rules
    verify: false
  audit_log:
    description: Append-only hash-chained audit log with PII-redacted diffs.
    period: {value: 7, unit: years}
    trigger: collection
    after: delete
    purge_job: purge_audit_log_partitions
    purge_metric: privacy_audit_partitions_purged_total
    source: proposed
    spec_ref: A item 9, B1 (spec gives no period)
    verify: true
    note: Spec says retention follows B1 but B1 lists no audit period. Seven years mirrors financial evidence. Hash chain makes deletion partition-wide, not row-wise.
  consent_evidence:
    description: Consent grants and withdrawals as proof of lawful processing.
    period: {value: 7, unit: years}
    trigger: collection
    after: delete
    purge_job: purge_consent_records
