    purge_job: revoke_seller_delivery_access
    purge_metric: privacy_seller_access_revoked_total
    source: spec
    spec_ref: B1 Sellers row
    verify: false
  underage_block:
    description: Device and DOB hash kept so a different DOB cannot be retried on the same device for 30 days.
    period: {value: 30, unit: days}
    trigger: collection
    after: delete
    purge_job: purge_age_blocks
    purge_metric: privacy_age_blocks_purged_total
    source: spec
    spec_ref: 1 Rules
    verify: false
  audit_log:
    description: Append-only hash-chained audit log with PII-redacted diffs.
    period: {value: 7, unit: years}
    trigger: collection
