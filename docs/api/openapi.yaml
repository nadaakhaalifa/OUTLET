      x-spec-ref: "§19, §23"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AdsConfig"
      responses:
        "200":
          description: "OK."
          headers:
            RateLimit-Limit:
              "$ref": "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              "$ref": "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              "$ref": "#/components/headers/RateLimitReset"
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdsConfig"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
        default:
          "$ref": "#/components/responses/Default"
components:
  securitySchemes:
    shopperBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Shopper access token: JWT, 10 minutes, audience outletnk-shopper, carries amr. Obtain via /v1/auth/*."
    sellerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Seller Center token: audience outletnk-seller, store-scoped (app.current_store_id), passkey or TOTP mandatory."
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Admin Console token: audience outletnk-admin, passkey mandatory, SSO and device posture, JIT elevation for sensitive scopes."
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token for internal calls (mTLS at the mesh in addition). Never issued to clients.
    appAttest:
      type: apiKey
      in: header
      name: X-App-Attest
      description: Apple App Attest assertion (iOS) or Play Integrity token (Android, Phase 2). Required on OTP, refresh and checkout.
    webhookHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC over the raw request body plus timestamp, with a per-provider secret from KMS; timestamp within 5 minutes (X-Timestamp), source IP allow-list, constant-time compare. The exact header names and algorithm are provider specific and VERIFY BEFORE LAUNCH per adapter.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Client generated UUIDv7. Replays within 24 h return the stored response with Idempotent-Replayed: true."
      schema:
        type: string
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional UUIDv7. This operation is naturally safe to repeat or is not a money, stock or order write; when supplied it is honoured with the same replay semantics.
      schema:
        type: string
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from page.next_cursor.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the representation being changed. Prevents lost updates.
      schema:
        type: string
  headers:
    ETag:
      description: Entity tag of the representation.
      schema:
        type: string
    RateLimitLimit:
      description: Requests allowed in the current window for the binding limit.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    RequestId:
      description: Correlates with logs, traces and the audit log.
      schema:
        type: string
    IdempotentReplayed:
      description: true when the response is a stored replay of an earlier request with the same Idempotency-Key.
      schema:
        type: boolean
  responses:
    BadRequest:
      description: Validation failed (Zod). Includes errors[] with JSON Pointers.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, expired or invalid credentials, or failed webhook signature.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "Authenticated but not permitted: wrong audience, missing scope, age gate, attestation failure or capability gated (B6)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Unknown, not owned by the caller, or from another tenant. Deliberately indistinguishable (API1/API3/API5).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: State conflict, for example invalid transition, blocked deletion, or a concurrent request with the same Idempotency-Key.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: If-Match did not match the current ETag.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: If-Match is required for this update.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Semantically invalid, or Idempotency-Key reused with a different request body (problem type idempotency-key-reuse).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Dependency unavailable or kill switch active. Retry with backoff and jitter.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Default:
      description: "Unexpected error. Generic body in production: no stack trace."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotModified:
      description: Representation unchanged.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
  schemas:
    Uuid:
      type: string
      format: uuid
      description: Opaque identifier. Never sequential.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 instant in UTC.
    Money:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]{1,18}$
          description: Integer minor units (piastres) as a decimal string, because JSON numbers cannot carry a bigint safely. 1 EGP = 100 piastres. Never a float. Parsed to bigint by Zod at the boundary.
          example: "129900"
        currency:
          type: string
          enum:
            - EGP
      description: EGP is the only currency at launch. Every amount carries its currency.
    LocalizedText:
      type: object
      additionalProperties: false
      required:
        - ar
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 2000
        en:
          type: string
          maxLength: 2000
      description: Arabic is required; English is an optional fallback.
    Locale:
      type: string
      enum:
        - ar-EG
        - en
    PageInfo:
      type: object
      additionalProperties: false
      required:
        - next_cursor
        - has_more
      properties:
        next_cursor:
          anyOf:
            - type: string
              maxLength: 512
            - type: "null"
          description: Opaque. Null on the last page.
        has_more:
          type: boolean
    Problem:
      type: object
      description: "RFC 9457 problem details. Generic in production: no stack traces, no internal identifiers beyond request_id."
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable problem type, e.g. /problems/idempotency-key-reuse.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine code for client branching and AR localisation.
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemViolation"
          description: Field level violations on 400.
      additionalProperties: true
    ProblemViolation:
      type: object
      additionalProperties: false
      required:
        - pointer
        - code
      properties:
        pointer:
          type: string
          description: JSON Pointer into the request.
        code:
          type: string
        detail:
          type: string
    OtpRequest:
      type: object
      additionalProperties: false
      required:
        - phone_e164
      properties:
        phone_e164:
          type: string
          pattern: ^\+20[0-9]{10}$
          description: Egypt country code only at launch (SMS pumping allow-list).
          x-pii-class: P3
        channel:
          type: string
          enum:
            - sms
            - whatsapp
        locale:
          $ref: "#/components/schemas/Locale"
    OtpChallenge:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - expires_at
        - resend_available_at
      properties:
        challenge_id:
          $ref: "#/components/schemas/Uuid"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        resend_available_at:
          $ref: "#/components/schemas/Timestamp"
        attempts_remaining:
          type: integer
          minimum: 0
          maximum: 5
        channel:
          type: string
          enum:
            - sms
            - whatsapp
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - code
        - device
      properties:
        challenge_id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          pattern: ^[0-9]{6}$
        device:
          $ref: "#/components/schemas/DeviceInfo"
    DeviceInfo:
      type: object
      additionalProperties: false
      required:
        - platform
        - install_id
      properties:
        platform:
          type: string
          enum:
            - ios
            - android
        install_id:
          $ref: "#/components/schemas/Uuid"
        app_version:
          type: string
        push_token:
          type: string
          x-pii-class: P2
    SocialLoginRequest:
      type: object
      additionalProperties: false
      required:
        - id_token
        - nonce
        - device
      properties:
        id_token:
          type: string
          description: Provider ID token. Verified server side against provider keys.
        nonce:
          type: string
        device:
          $ref: "#/components/schemas/DeviceInfo"
    AgeGateRequest:
      type: object
      additionalProperties: false
      required:
        - dob
        - device_id_hash
      properties:
        dob:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Date of birth, YYYY-MM-DD. Evaluated in Africa/Cairo. Not stored; only a keyed HMAC of it is kept for a block.
          x-pii-class: P3
        device_id_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 hex of a stable on-device identifier (store it in the Keychain so it survives reinstall). Re-keyed on the server.
          x-pii-class: P2
    AgeGatePassed:
      type: object
      additionalProperties: false
      required:
        - status
        - expires_at
      properties:
        status:
          type: string
          enum:
            - passed
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    PasskeyOptions:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - challenge
        - rp_id
        - expires_at
      properties:
        challenge_id:
          $ref: "#/components/schemas/Uuid"
        challenge:
          type: string
          description: base64url, 32 random bytes.
        rp_id:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    PasskeyRegisterRequest:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - credential
      properties:
        challenge_id:
          $ref: "#/components/schemas/Uuid"
        credential:
          type: object
          additionalProperties: true
          description: WebAuthn attestation response. Must carry `id` (the credential id).
    PasskeyAssertRequest:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - credential
        - device
      properties:
        challenge_id:
          $ref: "#/components/schemas/Uuid"
        credential:
          type: object
          additionalProperties: true
          description: WebAuthn assertion response. Must carry `id` (the credential id).
        device:
          $ref: "#/components/schemas/DeviceInfo"
    TokenPair:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - user
      properties:
        access_token:
          type: string
          description: JWT, 10 minutes, audience-scoped, carries amr.
        access_expires_at:
          $ref: "#/components/schemas/Timestamp"
        refresh_token:
          type: string
          description: Opaque, device-bound, 30 days, rotated on every use.
        refresh_expires_at:
          $ref: "#/components/schemas/Timestamp"
        user:
          $ref: "#/components/schemas/Me"
        second_factor_required:
          type: boolean
          description: True when a recycled number on a new device must complete a second factor before stored value is shown.
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
        - device_install_id
      properties:
        refresh_token:
          type: string
        device_install_id:
          $ref: "#/components/schemas/Uuid"
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - platform
        - created_at
        - last_seen_at
        - current
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        platform:
          type: string
          enum:
            - ios
            - android
        device_label:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_seen_at:
          $ref: "#/components/schemas/Timestamp"
        current:
          type: boolean
    Me:
      type: object
      additionalProperties: false
      required:
        - id
        - locale
        - age_band
        - limited_capacity
        - phone_verified
        - status
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        phone_masked:
          type: string
          description: Last 3 digits only.
          x-pii-class: P2
        email:
          anyOf:
            - type: string
              format: email
            - type: "null"
          x-pii-class: P2
        locale:
          $ref: "#/components/schemas/Locale"
        age_band:
          type: string
          enum:
            - unverified
            - 18_20
            - 21_plus
        limited_capacity:
          type: boolean
          description: True for 18-20 accounts (capabilities gated per B6).
        phone_verified:
          type: boolean
        status:
          type: string
          enum:
            - active
            - age_pending
            - blocked
            - deletion_pending
        style_vibes:
          type: array
          items:
            type: string
        favorite_brand_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        monthly_budget:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    MeUpdate:
      type: object
      additionalProperties: false
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
        email:
          type: string
          format: email
          x-pii-class: P2
        style_vibes:
          type: array
          items:
            type: string
          maxItems: 20
        favorite_brand_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          maxItems: 50
        monthly_budget:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        personalization_enabled:
          type: boolean
      minProperties: 1
    AgeAttestationRequest:
      type: object
      additionalProperties: false
      required:
        - date_of_birth
        - attests_18_or_older
        - device_install_id
      properties:
        date_of_birth:
          type: string
          format: date
          x-pii-class: P3
        attests_18_or_older:
          type: boolean
          const: true
        device_install_id:
          $ref: "#/components/schemas/Uuid"
    ConsentState:
      type: object
      additionalProperties: false
      required:
        - consents
      properties:
        consents:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - purpose
              - granted
              - updated_at
              - policy_version
            properties:
              purpose:
                type: string
                enum:
                  - marketing_push
                  - marketing_whatsapp
                  - marketing_email
                  - analytics
                  - personalization
                  - budget_insights
                  - measurements
                  - location_precise
                  - cross_border_ml
              granted:
                type: boolean
              updated_at:
                $ref: "#/components/schemas/Timestamp"
              policy_version:
                type: string
    ConsentUpdate:
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - purpose
              - granted
              - policy_version
            properties:
              purpose:
                type: string
                enum:
                  - marketing_push
                  - marketing_whatsapp
                  - marketing_email
                  - analytics
                  - personalization
                  - budget_insights
                  - measurements
                  - location_precise
                  - cross_border_ml
              granted:
                type: boolean
              policy_version:
                type: string
          minItems: 1
          maxItems: 20
    PrivacyBreachRecord:
      type: object
      additionalProperties: false
      required:
        - detected_at
        - severity
        - summary
        - affected_count
      properties:
        detected_at:
          $ref: "#/components/schemas/Timestamp"
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        affected_count:
          type: integer
          minimum: 0
          maximum: 1000000000
    PrivacyBreachTriage:
      type: object
      additionalProperties: false
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - notify
            - no_notification_required
    PrivacyBreach:
      type: object
      additionalProperties: false
      required:
        - id
        - detected_at
        - severity
        - summary
        - affected_count
        - status
        - clocks
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        detected_at:
          $ref: "#/components/schemas/Timestamp"
        severity:
          type: string
        summary:
          type: string
        affected_count:
          type: integer
        status:
          type: string
        dpo_decision:
          type: [string, "null"]
        triaged_at:
          type: [string, "null"]
        pdpc_notified_at:
          type: [string, "null"]
        subjects_notified_at:
          type: [string, "null"]
        closed_at:
          type: [string, "null"]
        clocks:
          type: object
          description: "Deadline clocks (triage 4 h, PDPC 72 h, subjects 3 days)."
          additionalProperties: true
    PrivacyBreachList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyBreach"
    PrivacyDeletion:
      type: object
      additionalProperties: false
      required:
        - status
        - blockers
      properties:
        status:
          type: string
          enum:
            - blocked
            - cooling_off
            - cancelled
            - completed
        cooling_off_ends_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        blockers:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - code
            properties:
              code:
                type: string
                enum:
                  - open_order
                  - open_return
                  - open_dispute
                  - store_credit_forfeiture_warning
              reference_id:
                $ref: "#/components/schemas/Uuid"
          description: Exactly why deletion is blocked or what the shopper forfeits.
        store_credit_balance:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    PrivacyExport:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - requested_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum:
            - queued
            - building
            - ready
            - expired
            - failed
        requested_at:
          $ref: "#/components/schemas/Timestamp"
        ready_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        download_url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
          description: Signed, valid 24 hours. Null until ready.
        download_expires_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        locale:
          type: string
          enum:
            - ar
            - en
          description: Language of the export archive, as requested (default ar).
        ready_target_at:
          $ref: "#/components/schemas/Timestamp"
          description: Latest time the export is promised to be ready (requested_at + 72 hours).
    PrivacyExportRequest:
      type: object
      additionalProperties: false
      properties:
        locale:
          type: string
          enum:
            - ar
            - en
          description: Archive language (the API validates ar or en; default ar).
    Address:
      type: object
      additionalProperties: false
      required:
        - id
        - recipient_name
        - phone_e164
        - governorate_code
        - city_district_code
        - street
        - building
        - courier_coverage
        - is_default
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
          maxLength: 40
        recipient_name:
          type: string
          maxLength: 120
          x-pii-class: P2
        phone_e164:
          type: string
          pattern: ^\+20[0-9]{10}$
