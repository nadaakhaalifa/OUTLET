# Outlex (code name Outlet NK) - Phase 1 OpenAPI skeleton.
# Sources: docs/BUILD-PROMPT.md §2-§5, docs/data-model.md (ERD names), ADR-0001/0003/0005/0006/0007/0008/0009,
# docs/specs/price-watch.md, docs/specs/shipping-domestic-international.md, docs/specs/ledger-chart-of-accounts.md,
# docs/security/threat-models.md, docs/security/api-top10-mapping.md, docs/analytics/events.md.
# Draft for owner review. Not legal advice. Items marked VERIFY map to docs/compliance/verify-register.md.
openapi: "3.1.0"
info:
  title: "Outlex API (code name Outlet NK)"
  version: "0.1.0-skeleton"
  summary: "Phase 1 web MVP contract skeleton. Documents only; no server implements it yet."
  description: |-
    Status: DRAFT SKELETON for owner review (Phase 0, 2026-11-07). Later this file is replaced by the OpenAPI generated from the NestJS code (ADR-0001); until then the Zod schemas and the generated web client are written against it.

    Conventions (details in docs/api/README.md):
    - Market: every market-scoped route is under /v1/{market}/ (lower-case markets.id, `eg`). Only GET /v1/markets is global.
    - Money: {amount_minor: string (bigint), currency}. Column `x_minor` + `currency` in the ERD is exposed as field `x` of type Money.
    - '% off': PriceDisplay.reference_price / display_discount_bp / member_discount_bp exist ONLY when VRP-verified (Price Watch). Otherwise absent.
    - Idempotency-Key (UUIDv7) on every mutating route except provider webhooks (provider event id) and pure POSTs (quotes, NL parse).
    - Lists: keyset cursor + limit (max 50). Errors: application/problem+json; not-owned = 404; wrong role = 403; 429 has Retry-After.
    - x-authz, x-rate-limit, x-market, x-idempotency, x-outbox-events, x-kill-switch, x-phase are documentation extensions read by the route-inventory test (API-T09).
    - No example uses a real brand name.
servers:
  - url: "https://api.outlex.invalid"
    description: "Placeholder. No domain, no hosting provisioned (ADR-0002: owner decision before provisioning)."
tags:
  - name: "Markets"
    description: "Market list (global plane) and public market configuration (ADR-0006)."
  - name: "Auth"
    description: "Phone OTP, Apple, Google, passkeys, refresh rotation, sessions (BUILD-PROMPT §4)."
  - name: "Me"
    description: "Account, preferences, addresses, follows, alerts."
  - name: "Privacy"
    description: "Privacy Center: consents, export, deletion (PDPL, master prompt §2, B1)."
  - name: "Wallet"
    description: "Closed-loop store credit, read only (ADR-0003). Behind a kill switch."
  - name: "Village"
    description: "Village carousel, stores, lit shelves, Discover deals, Drop Hour (UI reference spec)."
  - name: "Catalog"
    description: "Product page, live offer, slug resolver, QR defect passport (ADR-0009)."
  - name: "Price proof"
    description: "Public price-proof page and price reports (Price Watch §2.5)."
  - name: "Search"
    description: "Search, suggestions, NL parse (ADR-0010 engine behind SearchPort)."
  - name: "Cart"
    description: "Server-side bag grouped by store, defect acknowledgement."
  - name: "Checkout"
    description: "Shipping quote, checkout quote, one-payment checkout saga."
  - name: "Orders"
    description: "Order groups for shoppers, cancellation, COD confirmation."
  - name: "Returns"
    description: "Shopper returns, disputes and refunds (CPL 181/2018)."
  - name: "Media"
    description: "Signed uploads to private buckets (scan, re-encode, EXIF strip)."
  - name: "Webhooks"
    description: "Inbound PSP, courier and channel webhooks (HMAC on raw body)."
  - name: "Seller KYC"
    description: "Seller onboarding, KYC, agreements, payout instruments."
  - name: "Seller Store"
    description: "Store profile, settings, Brand Street storefront, team, locations."
  - name: "Seller Listings"
    description: "4-step listing wizard, defect card, units and QR passports, publish."
  - name: "Seller Inventory"
    description: "Stock levels and adjustments (row-per-unit pool, ADR-0005)."
  - name: "Seller Orders"
    description: "Seller order transitions (accept, reject, pack)."
  - name: "Seller Shipments"
    description: "Shipments and AWB labels (CourierPort, Bosta first)."
  - name: "Seller Returns"
    description: "Return inspection (48 h, silence = approve)."
  - name: "Price Watch"
    description: "Channel connections, matches, claims, findings, appeals (docs/specs/price-watch.md)."
  - name: "Seller Finance"
    description: "Balance, statements, payouts and tax documents (read only)."
  - name: "Seller Plans"
    description: "Seller SaaS plans (read only, ADR-0008)."
  - name: "Admin Auth"
    description: "Staff passkey session (after SSO)."
  - name: "Admin KYC"
    description: "KYC review and store suspension."
  - name: "Admin Price Integrity"
    description: "Price-integrity monitor and human review of suspensions."
  - name: "Admin Finance"
    description: "Reconciliation and dual-approval queue."
  - name: "Admin DPO"
    description: "DPO console: DSAR queue, breach register, transfers, consent stats, PII access log."
  - name: "Admin Tax"
    description: "ETA console: documents, resubmission, daily reconciliation."
  - name: "Admin RBAC"
    description: "Staff, roles, role grants, audit log, kill switches."
paths:
  "/v1/markets":
    get:
      operationId: "listMarkets"
      tags:
        - "Markets"
      summary: "List markets (global plane)"
      security: []
      parameters:
        - "$ref": "#/components/parameters/AcceptLanguage"
        - "$ref": "#/components/parameters/Cursor"
        - "$ref": "#/components/parameters/Limit"
      responses:
        "200":
          description: "OK"
          headers:
            Cache-Control:
              description: "Exactly: public, max-age=300"
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MarketPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
      x-authz:
        policy: "market.list"
        principal: "anonymous"
        tenant: "none"
        negative_tests:
          other_tenant: "n/a"
          wrong_role: "n/a"
      x-rate-limit:
        - limit: 600
          window_s: 60
          key: "ip_nat"
          source: "default"
          layer: "edge"
        - limit: 120
          window_s: 60
          key: "device"
          source: "default"
          layer: "app"
      x-market:
        source: "none"
        plane: "global"
      x-phase: 1
