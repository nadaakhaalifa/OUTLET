openapi: 3.1.0
info:
  title: Z-OUTLET API
  version: 0.1.0-draft
  summary: Phase 1 (MVP) contract skeleton for the Z-OUTLET marketplace API (spec name HAUL).
  description: |-
    Status: DRAFT SKELETON generated for Phase 0 review. No server implements this yet. The target is for this document to be replaced by the OpenAPI generated from the NestJS code (master prompt §T3); until then it is the contract the Zod schemas and mobile client are written against.

    Scope: every endpoint named in master prompt Part C sections 1-8, 14-15 and 19-24 that belongs to Phase 1 per P3, plus the price-integrity endpoints (§9) and fit endpoints (§10) that P3 puts in Phase 1. Phase 2 and 3 features (Plus, gift cards, stylist, budget suite, feed, creators) are intentionally absent: see docs/api/README.md.

    Operations marked x-derived are NOT named in the master prompt; they are required by the specified flows and need review.

    Anything legal, regulatory or provider specific is VERIFY BEFORE LAUNCH and listed in docs/open-questions.md and the master prompt P2 register.
  x-audience-note: "Arabic is the primary language: send Accept-Language: ar-EG (default) or en. Localised fields use the LocalizedText object."
servers:
  - url: https://api.outletnk.invalid
    description: Placeholder. No domain registered and no backend deployed (owner decision 2026-10-10).
tags:
  - name: Auth
    description: Passwordless sign-in, sessions, passkeys (§1).
  - name: Me
    description: Profile, onboarding preferences and the 18+ gate (§1, §B6).
  - name: Privacy
    description: "Privacy Center: consents, export, deletion (§2, §B1)."
  - name: Addresses
    description: Structured Egyptian addresses (§7).
  - name: Stores
    description: Worlds, store directory, My Stores (§3).
  - name: Search
    description: Search, filters, saved searches (§4).
  - name: Catalog
    description: Product page and price evidence (§5, §9).
  - name: Fit
    description: Size profiles and fit v1 (§10).
  - name: Cart
    description: Server-side bag grouped by store (§6).
  - name: Checkout
    description: Quote and one-payment checkout (§7).
  - name: Orders
    description: Order groups, seller orders, cancellation (§7, §20.1).
  - name: Webhooks
    description: Inbound provider webhooks, HMAC verified (§7, §21).
  - name: Wishlists
    description: Wishlists with intent and sharing (§8).
  - name: Wallet
    description: Closed-loop store credit (§15.2, ADR-0003).
  - name: Referrals
    description: Referrals core (§15.4).
  - name: Promotions
    description: Promotions engine and admin/seller CRUD (§17).
  - name: Seller KYC
    description: Seller onboarding and KYC (§19).
  - name: Seller Store
    description: Store profile and team (§19).
  - name: Seller Catalog
    description: Products, SKUs, stock, size charts, imports (§19, §20.2).
  - name: Seller Orders
    description: Seller-side order handling (§19, §20.1).
  - name: Fulfilment
    description: Shipments and labels (§21).
  - name: Returns
    description: Returns, exchanges, disputes (§22).
  - name: Price Integrity
    description: Channels, evidence, claims, trust (§9).
  - name: Seller Finance
    description: Balance, payouts, statements (§19, §T4).
  - name: Seller Analytics
    description: Seller analytics v1 (§19.1).
  - name: Admin
    description: Admin Console essentials (§23).
  - name: Notifications
    description: Preferences, push token, inbox (§24).
x-conventions:
  money: Integer minor units as decimal string plus currency (see Money).
  idempotency: Idempotency-Key = client UUIDv7, stored 24 h as (key, route, actor, request_hash, response). Same key with a different request hash returns 422 problem type idempotency-key-reuse. A concurrent in-flight request with the same key returns 409.
  pagination: Opaque cursor, limit 1-50 (default 20).
  caching: GET detail resources return ETag; clients revalidate with If-None-Match (304). Updates use If-Match (412 on mismatch, 428 when missing).
  errors: application/problem+json (RFC 9457). Not-found and not-owned both return 404.
  versioning: /v1 prefix. Deprecations are announced with Deprecation and Sunset headers at least 6 months ahead.
paths:
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags:
        - Auth
      summary: Request a phone OTP
      description: "App Attest (iOS) or Play Integrity token required. Country-code allow-list: Egypt only at launch. Resend timer grows exponentially. The device must have passed POST /v1/auth/age-gate: otherwise 403 problem age-gate-required (code age_gate_required), or age-blocked with blocked_until when it failed it."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      security:
        - appAttest: []
      x-scope:
        - public
      x-idempotent: false
      x-rate-limit:
        - limit: 3
          window_seconds: 900
          key: phone
          source: spec
        - limit: 10
          window_seconds: 86400
          key: device
          source: spec
        - limit: 30
          window_seconds: 3600
          key: ip
          source: proposed
      x-pii-class: P3
      x-phase: 1
      x-spec-ref: §1 Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: Accepted.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags:
        - Auth
      summary: Verify a phone OTP and start a session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      security:
        - appAttest: []
      x-scope:
        - public
      x-idempotent: false
      x-rate-limit:
        - limit: 5
          window_seconds: 300
          key: challenge
          source: spec
        - limit: 30
          window_seconds: 3600
          key: ip
          source: proposed
      x-pii-class: P3
      x-phase: 1
      x-spec-ref: §1 Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OK.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
  /v1/auth/apple:
    post:
      operationId: loginWithApple
      tags:
        - Auth
      summary: Sign in with Apple
      description: "Requires X-App-Attest and a passed /v1/auth/age-gate (403 age-gate-required / age-blocked otherwise). The ID token is verified server side (RS256, kid from the provider JWKS, iss, aud, exp, nonce; Apple may send the SHA-256 of the raw nonce). A nonce is single use. 401 problem invalid-identity-token with code invalid_identity_token, identity_token_expired, audience_mismatch, issuer_mismatch, nonce_mismatch or nonce_reused; 503 identity_provider_unavailable. Accounts are never linked by email; a new identity creates an account without a verified phone."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      security:
        - appAttest: []
      x-scope:
        - public
      x-idempotent: false
      x-rate-limit:
        - limit: 30
          window_seconds: 3600
          key: ip
          source: proposed
      x-pii-class: P2
      x-phase: 1
      x-spec-ref: §1 Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLoginRequest"
      responses:
        "200":
          description: OK.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
  /v1/auth/google:
    post:
      operationId: loginWithGoogle
      tags:
        - Auth
      summary: Sign in with Google
      description: "Same contract as /v1/auth/apple; the nonce is echoed verbatim by Google."
      parameters:
