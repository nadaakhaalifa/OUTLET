    PriceDisplay:
      type: "object"
      additionalProperties: false
      description: "Projection of sku_price_state. VRP RULE: `reference_price` (the strike-through price) and `display_discount_bp` (the '% off') are PRESENT ONLY when claim_type = verified_discount, the evidence is fresh (evidence_valid_until in the future, 72 h fail-closed) and the store discount_display_mode = public. `member_discount_bp` is present only when the mode = member_only and the caller is a signed-in member. In every other case the fields are ABSENT (not null, not 0). The '% off' is never computed by the client and never derived from a seller-entered 'was' price. The same value feeds JSON-LD and the product feed (CI test SEO-T01)."
      properties:
        current_price:
          "$ref": "#/components/schemas/Money"
        claim_type:
          type: "string"
          enum:
            - "verified_discount"
            - "lowest_30d"
            - "launch_price"
            - "plain"
        reference_price:
          "$ref": "#/components/schemas/Money"
          x-vrp-verified-only: true
        display_discount_bp:
          type: "integer"
          minimum: 0
          maximum: 10000
          description: "Basis points (1400 = 14%)."
          x-vrp-verified-only: true
        member_discount_bp:
          type: "integer"
          minimum: 0
          maximum: 10000
          description: "Basis points (1400 = 14%)."
          x-vrp-verified-only: true
        evidence_checked_at:
          type: "string"
          format: "date-time"
        price_proof_path:
          type: "string"
          maxLength: 500
      required:
        - "current_price"
        - "claim_type"
        - "price_proof_path"
      if:
        properties:
          claim_type:
            not:
              const: "verified_discount"
      then:
        properties:
          reference_price: false
          display_discount_bp: false
          member_discount_bp: false
