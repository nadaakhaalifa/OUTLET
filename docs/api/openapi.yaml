      summary: "Send a phone OTP (SMS, WhatsApp fallback)"
      description: "EG country codes only at launch, per-prefix spend caps, SMS spend circuit breaker, send-vs-verify ratio alert (SMS-pumping protection). The response is identical whether or not the phone has an account."
