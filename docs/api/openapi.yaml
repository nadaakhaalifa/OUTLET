      x-idempotent: false
      x-rate-limit:
        - limit: 60
          window_seconds: 60
          key: user
          source: proposed
      x-pii-class: P2
      x-phase: 1
      x-spec-ref: §24 Notifications
      x-derived: true
      requestBody:
