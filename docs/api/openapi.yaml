components:
  securitySchemes:
    shopperJwt:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "User access JWT (10 min, audience `outlet:{market}`, alg allow-list, carries amr). On the web, the Next.js BFF holds tokens in HttpOnly cookies (with CSRF protection) and calls the API with Bearer; the API never accepts cookie auth."
    sellerJwt:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Same user token family as shopperJwt (DM-09), but seller routes additionally require (a) a passkey in amr (`hwk`), (b) an active store_members row for X-Store-Id, (c) a role allowed by x-authz.roles. Missing passkey -> 403 `passkey-required`."
    adminPasskeySession:
      type: "http"
      scheme: "bearer"
      description: "Staff session token (separate principal, staff_sessions), issued only after SSO + device posture + passkey; IP allow-list for Finance and Super-admin. Audience `admin:{market}`. A shopper or seller token on an admin route -> 403 `wrong-principal`."
    webhookHmac:
      type: "apiKey"
      in: "header"
      name: "X-Signature"
      description: "Provider HMAC over the raw request body + timestamp within +/- 5 min + provider IP allow-list at the edge + dedup by provider event id."
  parameters:
    Market:
      name: "market"
      in: "path"
      required: true
      description: "Market path segment, lower-case markets.id (e.g. `eg`). Selects the data cell (ADR-0002/0006). An authenticated token is bound to one market: a different market -> 401 `market-mismatch`."
      schema:
        type: "string"
        pattern: "^[a-z]{2}(-[a-z0-9]{2,3})?$"
    AcceptLanguage:
      name: "Accept-Language"
      in: "header"
      required: false
      description: "ar-EG (default) or en-EG. Arabic content is always present; English is optional."
      schema:
        type: "string"
        enum:
          - "ar-EG"
          - "en-EG"
        default: "ar-EG"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "Client-generated UUIDv7. Stored 24 h as (key, actor, route, request_hash, response). Same key + different body -> 422 `idempotency-key-reuse`; same key while the first call is in flight -> 409 `idempotency-in-flight`; replay -> the stored response."
      schema:
        type: "string"
        format: "uuid"
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    StoreScope:
      name: "X-Store-Id"
      in: "header"
      required: true
      description: "Active store (Seller Center switcher). Must be a store where the caller has an active store_members row; otherwise 404. Applied with SET LOCAL app.current_store_id inside each transaction (never per session)."
      schema:
        type: "string"
        format: "uuid"
    StoreScopeOptional:
      name: "X-Store-Id"
      in: "header"
      required: false
      description: "Present only when a seller staff member uploads for a store; same rules as X-Store-Id."
      schema:
        type: "string"
        format: "uuid"
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      description: "ETag from the last read. Mismatch -> 412; missing -> 428."
      schema:
        type: "string"
    TurnstileToken:
      name: "X-Turnstile-Token"
      in: "header"
      required: true
      description: "Cloudflare Turnstile token (web replacement for App Attest, ADR-0007). Verified server-side."
      schema:
        type: "string"
        maxLength: 4096
    AdmissionToken:
      name: "X-Admission-Token"
      in: "header"
      required: false
      description: "Signed Waiting Room admission token (JWT, 15 min) bound to user + device; required while a waiting-room drop is LIVE."
      schema:
        type: "string"
        maxLength: 4096
    ReasonCode:
      name: "X-Reason-Code"
      in: "header"
      required: false
      description: "Reason code for revealing P2/P3 fields. Without it the response is masked. Every reveal writes pii_access_log."
      schema:
        type: "string"
        pattern: "^[a-z_]{3,40}(:[A-Za-z0-9-]{1,40})?$"
    WebhookSignature:
      name: "X-Signature"
      in: "header"
      required: true
      description: "Provider HMAC over the raw body (header name is provider-specific and mapped by the adapter)."
      schema:
        type: "string"
        maxLength: 512
    WebhookTimestamp:
      name: "X-Timestamp"
      in: "header"
      required: true
      description: "Provider timestamp; rejected outside +/- 5 min."
      schema:
        type: "string"
        maxLength: 64
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      description: "Opaque keyset cursor from next_cursor (encodes the last (sort key, id)). No OFFSET."
      schema:
        type: "string"
        maxLength: 512
    Limit:
      name: "limit"
      in: "query"
      required: false
      description: "Page size, 1-50 (default 20). 51 -> 400."
      schema:
        type: "integer"
        minimum: 1
        maximum: 50
        default: 20
  responses:
    BadRequest:
      description: "Malformed request, unknown or protected field (strict DTO), page size > 50."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Unauthorized:
      description: "Missing, invalid or expired credentials; token bound to another market; bad webhook signature or timestamp."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Forbidden:
      description: "Authenticated but not allowed: wrong role, wrong principal type, passkey/step-up required, age or capacity gate."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    NotFound:
      description: "Not found OR not owned by the caller (never 403 for objects of another tenant)."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Conflict:
      description: "State conflict: invalid state transition, price changed, stock shortfall, idempotency key in flight, version conflict."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Gone:
      description: "A sold one-off item: the product page is gone (410); the defect passport stays reachable."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    PreconditionFailed:
      description: "If-Match does not match the current ETag."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    PreconditionRequired:
      description: "If-Match header is required."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Unprocessable:
      description: "Valid JSON but a business rule failed, or Idempotency-Key reused with a different body."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    TooManyRequests:
      description: "Rate limited."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
      headers:
        Retry-After:
          description: "Seconds to wait."
          schema:
            type: "integer"
            minimum: 1
  schemas:
    Ack:
      type: "object"
      additionalProperties: false
      properties:
        ok:
          type: "boolean"
      required:
        - "ok"
    Address:
      type: "object"
      additionalProperties: false
      description: "addresses (P3 fields decrypted for the owner only; never cached; Cache-Control: private, no-store)."
      properties:
        cod_eligible:
          type: "boolean"
          description: "COD needs a landmark and a map pin."
        id:
          type: "string"
          format: "uuid"
        country_code:
          type: "string"
          pattern: "^[A-Z]{2}$"
        label:
          type:
            - "string"
            - "null"
          maxLength: 500
        recipient_name:
          type: "string"
          maxLength: 500
        phone_e164:
          type: "string"
          pattern: "^\\+[1-9][0-9]{7,14}$"
          description: "E.164. P3: stored encrypted with a blind index."
        fields:
          "$ref": "#/components/schemas/EgAddressFields"
        pin:
          oneOf:
            - "$ref": "#/components/schemas/MapPin"
            - type: "null"
        geo_area_id:
          type: "string"
          format: "uuid"
        is_default:
          type: "boolean"
        validated_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        created_at:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "country_code"
        - "recipient_name"
        - "phone_e164"
        - "fields"
        - "geo_area_id"
        - "is_default"
        - "created_at"
    AddressInput:
      type: "object"
      additionalProperties: false
      description: "Strict allow-list DTO (Zod .strict()): unknown or server-computed fields are rejected with 400 (API3)."
      properties:
        country_code:
          type: "string"
          pattern: "^[A-Z]{2}$"
        label:
          type: "string"
          maxLength: 500
        recipient_name:
          type: "string"
          maxLength: 500
        phone_e164:
          type: "string"
          pattern: "^\\+[1-9][0-9]{7,14}$"
          description: "E.164. P3: stored encrypted with a blind index."
        fields:
          "$ref": "#/components/schemas/EgAddressFields"
        pin:
          "$ref": "#/components/schemas/MapPin"
        is_default:
          type: "boolean"
      required:
        - "country_code"
        - "recipient_name"
        - "phone_e164"
        - "fields"
    AddressPage:
      type: "object"
      additionalProperties: false
      description: "Keyset page. next_cursor is null on the last page."
      properties:
        items:
          type: "array"
          maxItems: 50
          items:
            "$ref": "#/components/schemas/Address"
        next_cursor:
          type:
            - "string"
            - "null"
          maxLength: 512
      required:
        - "items"
        - "next_cursor"
    AdminKycCase:
      type: "object"
      additionalProperties: false
      description: "signatory_revealed is present only when X-Reason-Code is sent; every reveal writes pii_access_log."
      properties:
        case:
          "$ref": "#/components/schemas/KycCase"
        seller_legal:
          "$ref": "#/components/schemas/SellerLegalIdentity"
        checks:
          type: "array"
          items:
            "$ref": "#/components/schemas/KycCheck"
          maxItems: 50
        signatory_revealed:
          "$ref": "#/components/schemas/SignatoryInput"
      required:
        - "case"
        - "seller_legal"
        - "checks"
    AdminKycCaseSummary:
      type: "object"
