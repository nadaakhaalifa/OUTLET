  /v1/auth/age-gate:
    post:
      operationId: submitAgeGate
      tags:
        - Auth
      summary: Server-side 18+ gate before any OTP is sent
      description: "Not named in the master prompt as a path (the DOB step in section 1). Evaluated server side BEFORE /v1/auth/otp/request, /apple, /google and /passkey/assert; those refuse a device that has not passed (403 problem age-gate-required). Under 18 returns 403 problem age-blocked with the extension member blocked_until (now + 30 days). The block is keyed server side on three HMAC identifiers: the attested device key, the client device_id_hash and a keyed HMAC of the DOB (never a plain hash, inconsistencies I-05). Nothing else is stored, so it survives reinstall as far as the attestation key or device_id_hash persists (keep device_id_hash in the iOS Keychain). A pass is valid 24 hours. Requires X-App-Attest. Impossible or future DOB returns 422 invalid_dob. The device is the rate-limit key: 10 per day."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      security:
        - appAttest: []
      x-scope:
        - public
      x-idempotent: false
      x-rate-limit:
        - limit: 10
          window_seconds: 86400
          key: device
          source: proposed
        - limit: 30
          window_seconds: 3600
          key: ip
          source: proposed
      x-pii-class: P2
      x-phase: 1
      x-spec-ref: §1 Identity
      x-derived: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgeGateRequest"
      responses:
        "200":
          description: OK.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgeGatePassed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
  /v1/auth/passkey/register/options:
    post:
      operationId: passkeyRegisterOptions
      tags:
        - Auth
      summary: Get a single-use WebAuthn registration challenge
      description: "Needed because the WebAuthn client cannot build a credential without a server challenge. The challenge is bound to the signed-in user, valid 5 minutes, single use."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      security:
        - shopperBearer: []
      x-scope:
        - shopper:auth.write
      x-idempotent: false
      x-rate-limit:
        - limit: 10
          window_seconds: 60
          key: user
          source: proposed
      x-pii-class: P2
      x-phase: 1
      x-spec-ref: §1 Identity
      x-derived: true
      responses:
        "200":
          description: OK.
          headers:
