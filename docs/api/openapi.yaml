  "/v1/{market}/webhooks/psp/{provider}":
    post:
      operationId: "receivePspWebhook"
      tags:
        - "Webhooks"
      summary: "PSP / BNPL payment webhook"
      description: "Raw body stored (payment_events_raw), dedup by provider_event_id, amount and currency compared to the local intent (PAY-T02). 2xx is returned only after the inbox row commits."
      security:
        - webhookHmac: []
      parameters:
        - "$ref": "#/components/parameters/Market"
        - name: "provider"
          in: "path"
          required: true
          schema:
            type: "string"
            enum:
              - "paymob"
              - "kashier"
              - "fawry"
        - "$ref": "#/components/parameters/AcceptLanguage"
        - "$ref": "#/components/parameters/WebhookSignature"
        - "$ref": "#/components/parameters/WebhookTimestamp"
      requestBody:
        required: true
        description: "Raw provider bytes (max 256 KB). Signature verified before parsing."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ProviderWebhookPayload"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WebhookAck"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
      x-authz:
        policy: "webhook.psp"
        principal: "provider"
        tenant: "none (app_worker role; resolved through the local intent / shipment / connection)"
        negative_tests:
          other_tenant: "n/a: bad HMAC -> 401, stale timestamp -> 401, replayed event id -> 200 duplicate=true with no side effect"
          wrong_role: "n/a"
      x-rate-limit:
        - key: "provider_ip_allowlist"
          source: "build-prompt"
          layer: "edge"
          note: "Authenticity gate, not a budget: IP allow-list + HMAC over raw body + timestamp +/-5 min + per-provider edge rule."
      x-market:
        source: "path"
        param: "market"
        binding: "routes to the market cell"
      x-idempotency:
        header: "not used"
        mode: "provider_event_id_dedup"
        note: "Providers do not send our header; dedup key is the provider event id (unique) recorded with inbox_processed."
      x-outbox-events:
        - "webhook.received"
        - "payment.succeeded"
        - "payment.failed"
        - "order_group.paid"
        - "inventory.claimed"
      x-phase: 1
