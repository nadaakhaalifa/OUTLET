  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      summary: Rotate the refresh token
      description: "Rotating refresh with reuse detection: a reused token, or a token presented by another install (device_install_id), revokes the whole family, emits session.revoked with notifyUser and returns 401 invalid-refresh-token (all failure causes look identical). A concurrent rotation of the same token returns 409 refresh_conflict: keep only the pair from the winner. Not idempotency-cached. App Attest is optional here and used only as a rate-limit key (30/hour per device)."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      security:
        - appAttest: []
      x-scope:
        - public
      x-idempotent: false
      x-rate-limit:
        - limit: 30
          window_seconds: 3600
          key: device
          source: proposed
      x-pii-class: P2
      x-phase: 1
      x-spec-ref: §1 Identity
