        - "resolution"
    OrderTracking:
      type: "object"
      additionalProperties: false
      description: "Shipments of one order group. Only HAUL's normalised statuses are exposed; courier raw payloads never are. latest_event is the most recent normalised event (no per-event history is stored for shoppers)."
      required: ["order_group_id", "shipments", "server_time"]
      properties:
        order_group_id: { type: "string", format: "uuid" }
        server_time: { type: "string", format: "date-time" }
        shipments:
          type: "array"
          maxItems: 50
          items:
            type: "object"
            additionalProperties: false
            required: ["id", "seller_order_ids", "courier", "awb", "status", "attempts", "delivered_at", "latest_event"]
            properties:
              id: { type: "string", format: "uuid" }
              seller_order_ids: { type: "array", maxItems: 50, items: { type: "string", format: "uuid" } }
              courier: { type: "string", maxLength: 40 }
              awb: { type: ["string", "null"], maxLength: 64 }
              status: { type: "string", enum: ["LABEL_PENDING", "LABEL_READY", "PICKED_UP", "IN_TRANSIT", "OUT_FOR_DELIVERY", "DELIVERED", "DELIVERY_FAILED", "RTO", "RETURNED_TO_SELLER", "CANCELLED"] }
              attempts: { type: "integer", format: "int32" }
              delivered_at: { type: ["string", "null"], format: "date-time" }
              latest_event:
                type: ["object", "null"]
                additionalProperties: false
                required: ["status", "occurred_at"]
                properties:
                  status: { type: "string", maxLength: 40 }
                  occurred_at: { type: "string", format: "date-time" }
