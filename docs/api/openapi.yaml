  /v1/auth/passkey/assert/options:
    post:
      operationId: passkeyAssertOptions
      tags:
        - Auth
      summary: Get a single-use WebAuthn assertion challenge
      description: "Usernameless sign-in challenge: valid 5 minutes, single use, not bound to a user."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      security:
        - appAttest: []
      x-scope:
        - public
      x-idempotent: false
      x-rate-limit:
