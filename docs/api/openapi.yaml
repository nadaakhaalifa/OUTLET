  "/v1/{market}/auth/otp/verify":
    post:
      operationId: "verifyOtp"
      tags:
        - "Auth"
      summary: "Verify OTP and sign in or register"
      description: "5 attempts per code, then the code is burned. A new account needs a valid age_gate_token. A phone unused for > 180 days on a new device needs a second factor before stored value is shown."
      security: []
      parameters:
        - "$ref": "#/components/parameters/Market"
        - "$ref": "#/components/parameters/AcceptLanguage"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
