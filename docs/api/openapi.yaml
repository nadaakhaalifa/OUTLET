      x-scope:
        - shopper:sessions.read
      x-idempotent: false
      x-rate-limit:
        - limit: 120
          window_seconds: 60
          key: user
          source: proposed
      x-pii-class: P2
      x-phase: 1
      x-spec-ref: §1 Identity
      x-derived: true
      responses:
        "200":
          description: A page of results.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
