      parameters:
        - "$ref": "#/components/parameters/Market"
        - "$ref": "#/components/parameters/AcceptLanguage"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - "$ref": "#/components/parameters/TurnstileToken"
