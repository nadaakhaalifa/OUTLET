  /v1/me/sessions:
    get:
      operationId: listSessions
      tags:
        - Auth
      summary: List active sessions
      description: "Not named in the master prompt: Needed by the Privacy Center active-sessions row; the master prompt names only GET/DELETE /v1/me/sessions/{id}."
      parameters:
