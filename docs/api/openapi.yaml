      description: "Photos are required for defective, undisclosed_defect and not_as_described. A defect that was disclosed and acknowledged is not a defect reason (ADR-0009). Strict allow-list DTO (Zod .strict()): unknown or server-computed fields are rejected with 400 (API3)."
