verify_refs:
  V1: "PDPC licence category and fees; DPO qualification; statutory DSAR deadline; penalties"
  V2: "Data residency and cross-border transfer licence; LLM and SaaS vendor transfers"
  V3: "CBE: closed-loop store credit and gift cards outside e-money; aggregator collection and payout model"
  V4: "Paymob split or sub-merchant, tokenisation, recurring; fees; settlement T+n"
  V5: "BNPL providers: API, minimum age, refund and cancel flows, FRA marketing rules"
  V6: "ETA: e-receipt obligation date, delegated signing for sellers, marketplace reporting, VAT on vouchers and credit"
  V7: "CPL 181/2018: discount article text, refund deadline, 7-day cancel vs 14-day return, exclusions, platform liability"
  V8: "Age of majority 21 vs 18; contracts with 18-20 year olds"
  V11: "Bosta and Aramex API specs, COD remittance cycle"
  V13: "Product-match threshold tau precision on a labelled Egyptian set"
  V15: "Fully automatic seller suspension legality"
  V16: "Waiting-room vendor and region"
  V19: "Disclosed defects vs the 30-day defect right"
  V20: "CPA fake-discount fine ceiling; competition approval rules"
  V24: "VAT on seller plans and B2B lots"
  V26: "Courier COD refusal data; open-box-at-door support"
  V27: "Legality of monitoring seller websites with contract consent; residential-IP spot checks"
  V28: "Commission surcharge as a penalty enforceable under the Seller Agreement"
  V30: "Cross-border transfer between the EG cell and the next market's cell"
  V32: "Export eligibility, exporters' register, zero-rated VAT documentation"
  V33: "Courier rate cards, volumetric divisor, restricted items, DAP/DDP support"
  V34: "Destination duty, de-minimis and consumer-law rules for export countries"
  V36: "PSP support for foreign cards and multi-currency settlement"
  V37: "Huawei Cloud Cairo service catalog (Postgres version, pg_cron, PITR, multi-AZ, KMS, IaC)"
  V38: "Measured latency Cairo to Huawei Cairo, AWS me-central-1, Frankfurt"
  V39: "Whether the PDPC treats encrypted or tokenised data abroad as a transfer"
  V41: "Paymob split/sub-merchant and payout-from-settlement; Kashier connected accounts"
  V43: "Bosta webhook signing, rate limits, COD remittance cycle; Aramex API"
  V44: "WhatsApp Egypt rate card and template rules"
  V45: "SMS OTP providers and sender-ID rules in Egypt"
  V46: "Valify data residency, price, registry-backed match"
  V47: "Typesense Arabic support; search bake-off result"
  V51: "Ramadan 2027 and Eid al-Adha 2027 exact dates"
  V53: "Free-delivery threshold basis (subtotal after item discounts, before vouchers and credit)"
  V56: "Pantry and near-expiry rules; cosmetics rules; electronics warranty terms"
  V57: "Real brand names and logos only with written permission"
  V58: "AI-suggested HS code: seller confirms; legal accuracy duty"
  V68: "Cloudflare proxying of personal traffic (transfer question)"
  V69: "Egyptian product-safety rules for critical defects (e.g. kids' drawstrings, small parts)"
  V70: "(proposed) PDPL lawful bases: is legitimate interest available, and on what conditions (Law 151/2020 and Decision 816/2025)"
  V71: "(proposed) Statutory retention period for tax, accounting and commercial records (orders, invoices, ledger, raw financial webhooks)"
  V72: "(proposed) Retention period for seller KYC records after contract end, and whether AML rules apply to the marketplace"
  V73: "(proposed) Which fields are 'sensitive personal data' under PDPL (biometric KYC checks, financial data, children's data) and the extra conditions that apply"
  V74: "(proposed) Children's measurements in family size profiles: guardian consent and conditions under PDPL"
  V75: "(proposed) Exact seller identity fields CPL requires on listings, and whether a sole trader's name and register number may be published"
  V76: "(proposed) Whether pseudonymous first-party server events and security logs may run before analytics consent"
  V77: "(proposed) Erasure vs legal retention: keeping pseudonymised order and ledger rows after an account deletion request"
  V78: "(proposed) Automated risk decisions (COD block, prepaid-only) and shared refusal data: lawful basis, notice and the right to contest"

