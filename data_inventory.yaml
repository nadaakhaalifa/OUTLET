model_doc: docs/data-model.md
controller: "Outlex operating entity in Egypt (not yet incorporated; VERIFY)"
summary: {tables: 219, columns: 2288, personal_tables: 105, p0: 318, p1: 1714, p2: 235, p3: 21}

pii_classes:
  P0: "Public. May be cached on the CDN and projected to the global plane."
  P1: "Internal, not personal on its own (surrogate ids, operational data)."
  P2: "Personal. Access logged, in DSAR export and erasure scope."
  P3: "Sensitive. Field envelope encryption (KMS DEK), blind index for lookup, cell only, never to external LLMs, never to sellers."
encryption_values: [none, field_envelope, blind_index_hmac, one_way_hash]
residency_classes:
  cell: "Stored only in the market's cell (EG cell in Egypt for EG). All personal, money and stock data. Leaves the cell only through a licensed transfer (V2, V30)."
  cell_publishable: "Source of truth is in the cell. Columns tagged P0 may be projected to the global public plane through public outbox events. Non-P0 columns stay in the cell."
  global: "Global control plane: configuration, taxonomies and public reference data. Must hold no personal data (generator check)."
lawful_bases:
  contract: "Needed to perform the contract with the data subject (shopper terms, Seller Agreement)."
  legal_obligation: "Needed to meet a legal duty (tax, consumer protection, PDPL breach duties)."
  consent: "Explicit, specific, informed consent, withdrawable in one tap (master prompt B1)."
  legitimate_interest: "Fraud prevention and security. Availability and conditions under PDPL are VERIFY (proposed V70)."
  not_personal_data: "Table holds no personal data. Listed for completeness and residency tagging."
data_subjects:
