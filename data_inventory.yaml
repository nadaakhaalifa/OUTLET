# Outlex (code name Outlet NK) data inventory.
# Machine-readable PII, purpose, retention, processor, residency and lawful-basis tag for EVERY column of EVERY designed table.
# Source of truth for docs/privacy/ropa.md. Mirrors docs/data-model.md (same generator, same table and column set).
# STATUS: DRAFT, not reviewed by counsel or the DPO. Not legal advice. Every lawful basis, retention period and residency
# value is an engineering proposal; items in verify_refs are VERIFY BEFORE LAUNCH (docs/compliance/verify-register.md).
# CI rule (Phase 0b): a migration that adds a column without an entry here fails the build.
# Strings are JSON-quoted (valid YAML 1.2).

inventory_version: 1
