# CycloneDX SBOM per build (T5). The lockfile is the input.
name: sbom

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate CycloneDX 1.6 JSON (pinned cdxgen)
        env:
          CDXGEN_VERSION: "12.8.5"
        run: pnpm dlx "@cyclonedx/cdxgen@${CDXGEN_VERSION}" -t pnpm -o sbom.cdx.json --spec-version 1.6 .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
