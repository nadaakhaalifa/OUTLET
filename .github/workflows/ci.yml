# Continuous integration (spec A2, T5, T11). Contents are read-only everywhere; no job has a
# write token. Third-party actions are pinned to full commit SHAs (Renovate keeps them current).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  verify:
    name: install, typecheck, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  boundaries:
    name: architecture boundaries (dependency-cruiser, Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --version
      - run: pnpm depcruise

  coverage:
    name: coverage gate (domain >= 90 percent, ratchet elsewhere)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/coverage/check.mjs

  i18n-parity:
    name: Arabic and English key parity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test .github/scripts/i18n-check.test.mjs
      - run: pnpm i18n-check

  secret-scan:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits through the API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: semgrep (pinned version, registry rulesets, fails on findings)
        env:
          SEMGREP_VERSION: "1.180.0"
          SEMGREP_SEND_METRICS: "off"
        run: |
          set -euo pipefail
          pipx run --spec "semgrep==${SEMGREP_VERSION}" semgrep scan \
            --config p/typescript --config p/nodejs --config p/security-audit \
            --error --metrics=off \
            --exclude node_modules --exclude coverage --exclude "*.test.ts" \
            apps packages tooling

  dependency-audit:
    name: dependency audit (pnpm audit, OSV)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high --prod
      - name: OSV scan of the lockfile
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  iac:
    name: IaC checks (terraform fmt, validate, conftest, checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: validate every environment (no backend, no credentials)
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            terraform -chdir="infra/terraform/environments/$env" init -backend=false -input=false
            terraform -chdir="infra/terraform/environments/$env" validate
          done
      - name: policy-as-code (Conftest against the Terraform source)
        # Pinned release binary, checksum-verified against the release's own checksums file.
        env:
          CONFTEST_VERSION: "0.56.0"
        run: |
          set -euo pipefail
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          tarball="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" conftest
          ./conftest test infra/terraform --policy infra/terraform/policy --parser hcl2 --all-namespaces
      - name: Checkov
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        with:
          directory: infra/terraform
          framework: terraform
          config_file: infra/terraform/.checkov.yaml
          soft_fail: false

  contracts:
    name: contracts and generated artifacts (OpenAPI, privacy inventory, observability, workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI structural and contract rules
        run: node tooling/api/validate-openapi.mjs
      - name: Privacy data inventory covers every migration column (spec B1)
        run: |
          node --test tooling/privacy/test/inventory.test.mjs
          node --test tooling/privacy/test/*.test.mjs
          node tooling/privacy/check-inventory.mjs
      - name: Observability as code (generated files in sync, rule structure, burn-rate windows)
        run: |
          node --test tooling/observability/test/*.test.mjs
          node tooling/observability/generate.mjs --check
          node tooling/observability/validate-rules.mjs
      - name: Workflow lint (offline; every remote action must be a full SHA)
        run: node .github/scripts/validate-workflows.mjs --require-sha

  migrations-pg16:
    name: migrations and DB guarantees (real PostgreSQL 16)
    # Throw-away initdb cluster on the runner (not a services: container) because the scripts
    # need initdb/pg_ctl and the server log. pg16-verify.mjs is run by run-on-postgres16.sh.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure PostgreSQL 16 server binaries
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          /usr/lib/postgresql/16/bin/postgres --version
      - name: Apply every migration and run DB-level checks
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: bash tooling/db/run-on-postgres16.sh

  mutation:
    name: mutation testing (domain, on push and on demand)
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-mutation')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation
      - run: cd packages/domain && pnpm exec stryker run stryker.inventory.mjs
      - run: cd packages/domain && pnpm exec stryker run stryker.cart.mjs
      - run: cd packages/domain && pnpm exec stryker run stryker.refunds.mjs
      - run: cd packages/domain && pnpm exec stryker run stryker.promotions.mjs
      - run: cd packages/domain && pnpm exec stryker run stryker.auto-buy.mjs
      - run: cd packages/domain && pnpm exec stryker run stryker.creators.mjs
      - run: cd packages/domain && pnpm exec stryker run stryker.family-student.mjs
      - run: cd packages/domain && pnpm exec stryker run stryker.payouts.mjs
      - run: cd packages/domain && pnpm exec stryker run stryker.gift-cards.mjs
      - run: cd packages/domain && pnpm exec stryker run stryker.store-credit.mjs
      - run: cd packages/domain && pnpm exec stryker run stryker.calendar-gap.mjs
      - run: cd apps/api && pnpm exec stryker run stryker.refunds.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-report
          path: |
            packages/domain/reports/mutation/
            apps/api/reports/mutation/
          retention-days: 14

  inventory-concurrency:
    name: inventory concurrency proof (real PostgreSQL 16)
    # Blocking. PGlite is a single backend and cannot exercise SKIP LOCKED, advisory locks or
    # deadlock behaviour. Single-runner evidence only; it is not a production load test.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure PostgreSQL 16 server binaries
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          /usr/lib/postgresql/16/bin/postgres --version
      - name: Concurrency storm (RUNS x ATTEMPTS reserve/claim through CONNS connections)
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
          RUNS: "25"
          ATTEMPTS: "10000"
          CONNS: "100"
        run: bash tooling/db/inventory-concurrency.sh

  promtool:
    name: Prometheus rules (promtool check and test)
    # The only CI step that parses PromQL and runs the rule unit tests. Before this job promtool ran only in
    # tooling/infra/verify.sh. The binary is the official release tarball, pinned by version and sha256.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROMETHEUS_VERSION: "3.5.0"
      PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install promtool (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL -o "$dir/$archive" "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_SHA256}  $dir/$archive" | sha256sum -c -
          tar -xzf "$dir/$archive" -C "$dir" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          sudo install -m 0755 "$dir/promtool" /usr/local/bin/promtool
          promtool --version
      - name: promtool check rules
        run: promtool check rules infra/observability/prometheus/rules/*.yaml
      - name: promtool test rules
        run: |
          set -euo pipefail
          for t in infra/observability/prometheus/tests/*.test.yaml; do
            echo "== $t"
            promtool test rules "$t"
          done
      - name: Every rule file has a test
        run: |
          set -euo pipefail
          for r in infra/observability/prometheus/rules/*.rules.yaml; do
            base="$(basename "$r" .rules.yaml)"; base="${base#slo-}"
            test -f "infra/observability/prometheus/tests/${base}.test.yaml" || { echo "no test for $r"; exit 1; }
          done
